html,body{height:100%}
[hidden]{display:none!important}

.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.75;animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:260px;height:260px;background:var(--b1);top:-60px;left:-80px}
.blobs i:nth-child(2){width:300px;height:300px;background:var(--b2);top:30%;right:-120px;animation-delay:-5s}
.blobs i:nth-child(3){width:240px;height:240px;background:var(--b3);bottom:-60px;left:10%;animation-delay:-9s}
.blobs i:nth-child(4){width:180px;height:180px;background:var(--b4);top:55%;left:-60px;animation-delay:-3s}
.blobs i:nth-child(5){width:200px;height:200px;background:var(--b5);top:8%;right:20%;animation-delay:-12s}

button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}

.enter-r.pop-in>*,.enter-l.pop-in>*{animation:none}

.out-f,.out-r{animation-name:outL} .out-b,.out-l{animation-name:outR} .out-u{animation-name:outD}
@keyframes outL{to{opacity:0;transform:translateX(-14px)}} @keyframes outR{to{opacity:0;transform:translateX(14px)}} @keyframes outD{to{opacity:0;transform:scale(.93) translateY(-14px)}}

.wardstage .rwin,.roomprev .rwin{display:none}
.stage .stk,.wardstage .stk,.roomprev .stk{filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.stage .stk{--rs:30px}

@media (prefers-reduced-motion: reduce){.rlight,.rdust{animation:none}}

#pagebg .stk{opacity:.5;--rs:56px}
.stage .stk{--rs:34px;animation:floaty 5s ease-in-out infinite}
.stage .stk:nth-child(2n){animation-delay:-2s}
@keyframes floaty{50%{translate:0 -6px}}
.designer{position:relative;height:min(50vh,430px);aspect-ratio:3/4;max-width:100%;margin:0 auto;border-radius:var(--r);border:2.5px solid var(--edge);box-shadow:0 5px 0 var(--drop);overflow:hidden;touch-action:none}
.designer .stk{cursor:grab;touch-action:none;--rs:42px;transition:outline .1s}
.designer .stk.sel{outline:3px dashed var(--accent);outline-offset:5px;border-radius:10px}
.designer .dfig{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:76%;pointer-events:none}
.designer .dfig svg{height:100%;width:auto}
.stkpal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stkpal button{aspect-ratio:1;font-size:1.7rem;border-radius:14px;border:2px solid var(--edge);background:var(--paper);box-shadow:0 3px 0 var(--drop);position:relative;padding:0}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.themes button{aspect-ratio:1;border-radius:16px;border:2.5px solid var(--edge);box-shadow:0 3px 0 var(--drop);position:relative;font-size:.68rem;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding:4px;line-height:1.05;color:#2A2650;overflow:hidden}
.themes button.dk{color:#fff}
.themes button.on{outline:4px solid var(--accent);outline-offset:2px}
.lockb::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,16,50,.45);border-radius:inherit;font-size:1.1rem}
.stktools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stktools .btn{min-height:46px;font-size:.9rem;padding:4px;border-radius:14px}
.wardstage .fig{position:relative}
.wardstage .fig svg{position:relative}
.roomprev{position:relative;height:200px;border-radius:var(--r);overflow:hidden;border:2.5px solid var(--edge)}
.roomprev .dfig{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:90%}
.roomprev .dfig svg{height:100%;width:auto}

/* shop + čítanka */
.lvl.coinchip{background:var(--paper);color:var(--ink);cursor:pointer}
.shophead{display:flex;align-items:center;gap:14px;padding:14px;background:var(--sun-soft)}
.shophead .coinbig{font-size:3rem;animation:wig 2.4s infinite}
.shophead b{font-family:var(--f-display);font-size:2.2rem;line-height:1;display:block}
.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.shopitem{padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.shopitem .th{width:100%;aspect-ratio:1.2;border-radius:16px;background:var(--paper2);overflow:hidden;display:grid;place-items:center;font-size:3.2rem;border:2px dashed var(--line)}
.shopitem .th svg{width:100%;height:100%}
.shopitem b{font-family:var(--f-display);font-size:1rem;line-height:1.1}
.shopitem .btn{width:100%}
.shopitem.own .th{border:2px solid var(--good);background:var(--good-soft)}
.shopitem .tag{font-weight:800;font-size:.8rem;color:var(--good)}
.btn[aria-disabled="true"]{opacity:.55}
.readtext{padding:18px;font-size:1.25rem;line-height:1.65;font-weight:700}
.readtext.g1{font-size:1.6rem;line-height:1.7;font-family:var(--f-display)} .readtext.g2{font-size:1.4rem}
.recbtn.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.rq{display:flex;flex-direction:column;gap:8px}
.rq .opt{min-height:52px}
/* tutorial + parent texts */
.tutsheet{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-top:3px solid var(--edge);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(20,16,50,.25);animation:up .35s cubic-bezier(.2,.9,.3,1.15)}
.tutsheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tutrow{display:flex;gap:12px;align-items:center}
.tutrow p{font-weight:800;font-size:1.1rem;line-height:1.35}
.tutemoji{font-size:2.8rem;line-height:1;animation:wig 1.6s infinite;flex:none}
.tutfocus{outline:5px solid #FFC94D;outline-offset:5px;border-radius:18px;animation:tutpulse 1.1s ease-in-out infinite;position:relative;z-index:40;box-shadow:0 0 0 5px #FF7A59,0 0 0 200vmax rgba(12,10,40,.62)!important}
@keyframes tutpulse{50%{outline-offset:11px;outline-color:#fff}}

body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--topoc,var(--ink));opacity:var(--topoo,.12);-webkit-mask:var(--topo) 0 0/560px 560px repeat;mask:var(--topo) 0 0/560px 560px repeat}
body::before{background:var(--pg,var(--bg))!important}
.blobs,#pagebg{display:none!important}
.top{background:color-mix(in srgb,var(--pg,var(--bg)) 82%,transparent)!important}
.grades button,.grades button b{color:#2A2650!important}
.list .swatches{display:flex;flex-wrap:wrap;gap:10px}
.list .swatches .sw{width:40px;height:40px;min-width:40px;border-radius:50%;border:2.5px solid var(--edge);box-shadow:0 3px 0 var(--drop);padding:0;cursor:pointer}
.list .swatches .sw.on{outline:4px solid var(--accent);outline-offset:2px}
.sw.swauto{background-image:linear-gradient(135deg,transparent 45%,rgba(128,128,128,.5) 45% 55%,transparent 55%)!important}
.ptext{display:flex;flex-direction:column;gap:8px;padding:12px 0;border-bottom:2px dashed var(--line)}
.ptext:last-child{border-bottom:0}

.hint{font-size:.85rem;color:var(--muted);font-weight:700}
.countgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:260px;font-size:2.1rem}
.countgrid span{animation:popin .35s backwards cubic-bezier(.3,1.6,.5,1)} @keyframes popin{from{transform:scale(0)}}
.coins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.coin{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:#F2C14E;color:#5A3D00;border:3px solid #C99511;animation:popin .35s backwards}
.coin.c1{background:#E6E8EE;border-color:#B0B4C4;color:#33364A}.coin.c5,.coin.c10{border-radius:10px;width:86px;height:50px;background:#C9E7D1;border-color:#5FA77A;color:#1F4D2E}.coin.c10{background:#F8C9C2;border-color:#D46A5A;color:#5A1E14}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:68px;font-family:var(--f-display);font-weight:800;font-size:1.35rem;padding:10px;border-radius:18px;border:2.5px solid var(--edge);background:var(--paper);box-shadow:0 5px 0 var(--drop);transition:transform .1s,box-shadow .1s,background .2s;line-height:1.15;word-break:break-word}
.opt.long{font-size:1.05rem}
.opt:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 var(--drop)}
.opt.right{background:var(--good);color:#fff;animation:yay .55s cubic-bezier(.3,1.8,.5,1)} @keyframes yay{40%{transform:scale(1.08) rotate(-2deg)}}
.opt.wrong{background:var(--bad);color:#fff;animation:shake .45s}
.opt.dim{opacity:.4}
.opts.locked .opt{pointer-events:none}
.pad{display:flex;flex-direction:column;gap:10px}
.padshow{font-family:var(--f-display);font-weight:800;font-size:2.2rem;text-align:center;min-height:64px;padding:4px;border-radius:18px;border:2.5px dashed var(--edge);background:var(--paper)}
.padshow.right{background:var(--good);color:#fff;border-style:solid}.padshow.wrong{background:var(--bad);color:#fff;border-style:solid;animation:shake .45s}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{min-height:56px;font-family:var(--f-display);font-weight:800;font-size:1.6rem;border-radius:16px;border:2.5px solid var(--edge);background:var(--paper);box-shadow:0 4px 0 var(--drop)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--drop)}
.key.ok{background:var(--good);color:#fff}.key.del{background:var(--paper2)}.key.op{background:var(--lilac-soft)}.key.eq{background:var(--accent);color:#fff}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:33;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2.5px solid var(--edge);border-radius:24px 24px 0 0;animation:up .32s cubic-bezier(.2,.9,.3,1.15);max-height:80vh;overflow:auto}
.fb .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fbtop{display:flex;align-items:center;gap:10px}
.fbbear{flex:none;width:112px;height:112px;animation:fbpop .55s cubic-bezier(.3,1.7,.5,1)}
.fbbear svg{width:100%;height:100%;filter:drop-shadow(0 5px 0 rgba(0,0,0,.12))}
@keyframes fbpop{0%{transform:translateY(70px) scale(.4);opacity:0}60%{transform:translateY(-10px) scale(1.08);opacity:1}}
.fbbub{position:relative;flex:1;background:var(--paper);border:2px solid var(--edge);border-radius:18px 18px 18px 4px;padding:10px 12px;box-shadow:0 4px 0 var(--drop);animation:fbbub .4s .18s backwards cubic-bezier(.3,1.6,.5,1)}
@keyframes fbbub{from{transform:scale(.6);opacity:0}}
.fbbub h3{font-size:1.2rem!important;line-height:1.2}
.evsum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evsum>div{border-radius:16px;padding:10px;text-align:center;border:2px solid var(--line)}
.evsum .ok{background:var(--good-soft)}.evsum .no{background:var(--bad-soft)}
.evsum b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1}.evsum span{font-weight:700;font-size:.85rem}
.evrep{background:var(--sun-soft);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tlog h3{font-size:1.1rem;margin-top:4px}
.evt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}.evt small{font-weight:700;opacity:.7;white-space:nowrap}
.evok summary{font-family:var(--f-display);font-weight:800;font-size:1.1rem;cursor:pointer;padding:6px 0}
.evok[open]{display:flex;flex-direction:column;gap:8px}
.fb h3{font-size:1.5rem;display:flex;align-items:center;gap:8px}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb p{font-weight:700}
.explain{background:var(--paper);border:2px solid var(--edge);border-radius:16px;padding:10px 12px;font-weight:700;display:flex;gap:10px;align-items:flex-start;white-space:pre-wrap}
.explain svg{width:38px;height:38px;flex:none}
.timer{font-family:var(--f-display);font-weight:800;font-size:1.2rem;min-width:64px;text-align:center;padding:2px 10px;border-radius:12px;border:2.5px solid var(--edge);background:var(--paper);white-space:nowrap}
.timer.low{background:var(--bad);color:#fff;animation:pulse .6s infinite}

/* peeking pet + calculator */
.peek{position:fixed;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(-26px + env(safe-area-inset-bottom,0px));z-index:31;width:92px;height:92px;font-size:76px;line-height:92px;text-align:center;animation:peekin .7s cubic-bezier(.3,1.6,.5,1) .3s backwards,peekbob 2.4s ease-in-out 1s infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
@keyframes peekin{from{transform:translateY(120%)}} @keyframes peekbob{50%{transform:translateY(-6px) rotate(-4deg)}}
.peek.happy{animation:peekyay .6s cubic-bezier(.3,1.8,.5,1)} @keyframes peekyay{40%{transform:translateY(-34px) rotate(10deg) scale(1.1)}}
.peekbub{position:fixed;left:calc(max(10px,env(safe-area-inset-left,0px)) + 84px);bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--paper);border:2.5px solid var(--edge);border-radius:16px 16px 16px 4px;padding:6px 10px;font-weight:800;font-size:.85rem;box-shadow:0 3px 0 var(--drop);animation:popUp .4s cubic-bezier(.3,1.6,.5,1);max-width:200px;pointer-events:none}
.calcshow{font-family:var(--f-display);font-weight:800;font-size:2.2rem;text-align:right;padding:6px 14px;border-radius:16px;border:2.5px solid var(--edge);background:var(--paper2);min-height:64px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.calcshow small{display:block;font-size:.95rem;color:var(--muted);min-height:1.2em}
.keys.c4{grid-template-columns:repeat(4,1fr)}

/* cards */
.flip{perspective:1200px;height:320px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--sun-soft)}
.face .ft{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.2}
.face .ft.huge{font-size:2.8rem}
.face .tap{position:absolute;bottom:12px;font-size:.85rem;font-weight:800;color:var(--muted)}
.cq{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.cardnav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.deckinfo{text-align:center;font-weight:800;color:var(--muted);font-size:.9rem}
.flyL{animation:flyL .35s forwards} .flyR{animation:flyR .35s forwards}
@keyframes flyL{to{transform:translateX(-120%) rotate(-14deg);opacity:0}} @keyframes flyR{to{transform:translateX(120%) rotate(14deg);opacity:0}}

/* pexeso */
.pex{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:block;width:100%;padding:0;aspect-ratio:1/1.05;perspective:800px;max-width:100%}
.tile .inner{display:block;position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.tile.on .inner,.tile.done .inner{transform:rotateY(180deg)}
.tile .face{border-radius:16px;border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--drop);padding:6px}
.tile .face.front{background:linear-gradient(140deg,var(--lilac),var(--c-sjl));color:#fff;font-family:var(--f-display);font-weight:800;font-size:2rem}
.tile .face.back{background:var(--paper);font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1.1;word-break:break-word}
.tile .face.back.e{font-size:2.3rem}
.tile.done .face.back{background:var(--good-soft)}

/* spájačka & triedička */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 40px}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mcol{display:flex;flex-direction:column;gap:12px}
.mi2{min-height:58px;padding:8px;border-radius:16px;border:2.5px solid var(--edge);background:var(--paper);box-shadow:0 4px 0 var(--drop);font-family:var(--f-display);font-weight:800;font-size:1.1rem;line-height:1.1;word-break:break-word;position:relative;z-index:1;transition:transform .15s,background .2s}
.mi2.e{font-size:2rem}
.mi2.sel{background:var(--sun);transform:scale(1.05)}
.mi2.done{color:#fff;pointer-events:none;animation:yay .5s}
.mi2.bad{animation:shake .45s;background:var(--bad-soft)}
.sortcard{padding:22px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:2rem;min-height:120px;display:grid;place-items:center}
.sortcard.enter{animation:qin .4s cubic-bezier(.2,.9,.3,1.25)}
.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bin{min-height:86px;border-radius:18px;border:2.5px solid var(--edge);box-shadow:0 5px 0 var(--drop);font-family:var(--f-display);font-weight:800;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;line-height:1.1}
.bin .bi{font-size:1.6rem}
.bin.right{animation:yay .5s;background:var(--good)!important;color:#fff} .bin.wrong{animation:shake .45s;background:var(--bad)!important;color:#fff}

/* minigames */
.gamearea{position:relative;height:min(62vh,520px);border-radius:var(--r);border:2.5px solid var(--edge);box-shadow:0 5px 0 var(--drop);overflow:hidden;background:linear-gradient(180deg,#BDE0FE,#E6F4FF 70%,#CDEFD9)}
.gamearea.rain{background:linear-gradient(180deg,#DCCBFF,#F4EEFF 70%,#FFE6F1)}
.target{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-align:center;padding:10px;border-radius:16px;background:var(--paper);border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--drop)}
.target b{color:var(--accent);font-size:1.7rem}
.balloon{position:absolute;bottom:-110px;width:86px;height:104px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:#2A2650;border:2.5px solid rgba(42,38,80,.6);animation:rise linear forwards;padding:0 4px;line-height:1}
.balloon::after{content:"";position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:rgba(42,38,80,.5)}
@keyframes rise{to{transform:translateY(calc(-1 * min(62vh,520px) - 140px))}}
.popped{animation:popb .3s forwards!important} @keyframes popb{to{transform:scale(1.6);opacity:0}}
.drop{position:absolute;top:-60px;padding:8px 14px;border-radius:16px;background:var(--paper);border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--drop);font-family:var(--f-display);font-weight:800;font-size:1.15rem;animation:fall linear forwards;white-space:nowrap;color:var(--ink)}
@keyframes fall{to{transform:translateY(calc(min(62vh,520px) + 80px))}}
.hearts{flex:none;font-size:1.2rem;letter-spacing:1px;white-space:nowrap}
.tfcard{padding:28px 18px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:2rem;min-height:180px;display:grid;place-items:center;line-height:1.2}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tfbtns button{min-height:96px;font-size:2.6rem;border-radius:22px;border:2.5px solid var(--edge);box-shadow:0 6px 0 var(--drop)}
.tfbtns .yes{background:var(--good);color:#fff}.tfbtns .no{background:var(--bad);color:#fff}
.gamelist{display:flex;flex-direction:column;gap:14px}
.gcard{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;padding:14px;text-align:left;width:100%}
.gcard .gi{width:76px;height:76px;border-radius:20px;border:2.5px solid var(--edge);display:grid;place-items:center;font-size:2.6rem;animation:wig 3s infinite}
.gcard b{font-family:var(--f-display);font-size:1.3rem;display:block;line-height:1.1}
.gcard span{font-weight:700;color:var(--muted);font-size:.9rem;display:block}

/* result + overlays */
.result{align-items:center;text-align:center;padding:24px 18px;display:flex;flex-direction:column;gap:12px}
.bigstars{display:flex;gap:6px;font-size:3.4rem;line-height:1}
.bigstars span{animation:starin .6s backwards cubic-bezier(.3,1.8,.5,1);filter:drop-shadow(0 3px 0 var(--drop))}
.bigstars span.off{filter:grayscale(1) opacity(.35)}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}}
.result h1{font-size:2.1rem}
.score{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.xpgain{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--accent)}
.rowbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.over{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 50% 40%,rgba(255,201,77,.55),rgba(20,16,50,.75));animation:fade .3s}
.over .box{width:100%;max-width:420px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:boing .6s cubic-bezier(.3,1.6,.5,1);max-height:92vh;overflow:auto}
@keyframes boing{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.over .num{font-family:var(--f-display);font-weight:800;font-size:4.5rem;line-height:1;color:var(--accent);text-shadow:0 4px 0 var(--drop)}
.gift{font-size:4.4rem;line-height:1;cursor:pointer;animation:giftw 1s infinite}
@keyframes giftw{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.06)}75%{transform:rotate(10deg) scale(1.06)}}
.gift.open{animation:giftopen .5s forwards} @keyframes giftopen{to{transform:scale(1.9);opacity:0}}
.rewards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.rew{width:96px;padding:6px;border-radius:16px;background:var(--paper2);border:2px solid var(--edge);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.8rem;animation:popin .45s backwards cubic-bezier(.3,1.6,.5,1);line-height:1.1}
.rew .th{width:78px;height:78px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:2.4rem}
.rew .th svg{width:100%;height:100%}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.cal .d{border-radius:16px;border:2.5px solid var(--edge);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.75rem;background:var(--paper)}
.cal .d .di{font-size:1.6rem;line-height:1}
.cal .d.got{background:var(--good-soft);opacity:.75} .cal .d.now{background:var(--sun);color:#2A2650;animation:wig 1.6s infinite} .cal .d.big{grid-column:span 2}

/* wardrobe */
.wardstage{display:grid;grid-template-columns:140px 1fr;gap:12px;align-items:center;padding:0;position:sticky;top:calc(env(safe-area-inset-top,0px) + 70px);z-index:10;overflow:hidden}
.wardstage .fig{height:216px;display:grid;place-items:center;overflow:hidden;border-right:2.5px solid var(--edge)}
.wardstage .fig svg{height:216px;width:auto;max-width:100%}
.wardstage .info{display:flex;flex-direction:column;gap:8px;min-width:0;padding:10px 12px 10px 0}
.wardstage h2{font-size:1.4rem}
.cats{display:flex;gap:8px;overflow-x:auto;padding:4px 2px 10px;scrollbar-width:none}
.cats::-webkit-scrollbar{display:none}
.items{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.item{position:relative;aspect-ratio:1;border-radius:18px;border:2.5px solid var(--edge);background:var(--paper);box-shadow:0 4px 0 var(--drop);overflow:hidden;padding:0;display:grid;place-items:center;font-size:2.6rem}
.item svg{width:100%;height:100%}
.item .lab{position:absolute;left:0;right:0;bottom:0;font-size:.72rem;font-weight:800;background:color-mix(in srgb,var(--paper) 85%,transparent);padding:2px 4px;text-align:center;white-space:nowrap;overflow:hidden;text-overflow:ellipsis}
.item.on{outline:4px solid var(--accent);outline-offset:2px;animation:yay .4s}
.item.lock{filter:grayscale(.85);opacity:.65}
.item .lk{position:absolute;inset:0;display:flex;flex-direction:column;align-items:center;justify-content:center;font-family:var(--f-display);font-weight:800;font-size:.85rem;color:#fff;background:rgba(20,16,50,.45);line-height:1.1;text-align:center;padding:4px}
.item .lk b{font-size:1.5rem;line-height:1}
.colorbox{padding:12px;display:flex;flex-direction:column;gap:10px}
.colorbox b{font-family:var(--f-display)}
.sw{aspect-ratio:1;border-radius:50%;border:3px solid var(--edge);box-shadow:0 3px 0 var(--drop);position:relative;padding:0}
.sw.on{outline:4px solid var(--accent);outline-offset:2px;transform:scale(1.1)}
.sw.lock::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;font-size:1rem;background:rgba(20,16,50,.4);border-radius:50%}
.sw.rb{background:conic-gradient(#FF6A8A,#FFC23C,#2FC08A,#6B7BFF,#FF6A8A)!important}
.swatches{display:grid;grid-template-columns:repeat(6,1fr);gap:12px;padding:4px}

/* rewards road */
.seg{display:flex;gap:6px;background:var(--paper2);padding:5px;border-radius:16px;border:2px solid var(--line)}
.seg button{flex:1;padding:10px 4px;border-radius:12px;font-family:var(--f-display);font-weight:800;font-size:.95rem}
.seg button.on{background:var(--paper);box-shadow:0 3px 0 var(--drop);border:2px solid var(--edge)}
.road{position:relative;padding:8px 0}
.road svg.path{position:absolute;inset:0;width:100%;height:100%;pointer-events:none}
.node{position:relative;display:flex;align-items:center;gap:12px;margin:10px 0;z-index:1}
.node.r{flex-direction:row-reverse;text-align:right}
.node .ln{width:64px;height:64px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.5rem;border:3px solid var(--edge);background:var(--paper);box-shadow:0 4px 0 var(--drop);flex:none;line-height:1}
.node .ln small{display:block;font-size:.6rem;letter-spacing:.06em}
.node.got .ln{background:var(--good);color:#fff}
.node.now .ln{background:var(--sun);color:#2A2650;animation:pulse 1.4s infinite}
.node .nc{flex:1;min-width:0;background:var(--paper);border:2.5px solid var(--edge);border-radius:18px;padding:8px;box-shadow:0 4px 0 var(--drop)}
.node .nc b{font-family:var(--f-display);font-size:1rem;display:block;margin-bottom:6px}
.node .ri{display:flex;gap:6px;flex-wrap:wrap}
.node.r .ri{justify-content:flex-end}
.node .rt{width:58px;display:flex;flex-direction:column;align-items:center;gap:1px;font-size:.62rem;font-weight:800;line-height:1.05;text-align:center}
.node .rt span.t{width:56px;height:56px;border-radius:14px;border:2px solid var(--edge);background:var(--paper2);overflow:hidden;display:grid;place-items:center;font-size:1.8rem}
.node .rt svg{width:100%;height:100%}
.node:not(.got) .rt span.t{filter:grayscale(.6);opacity:.75}
.node .me{position:absolute;width:44px;height:44px;border-radius:50%;border:2.5px solid var(--edge);overflow:hidden;background:var(--paper);top:-14px;left:36px;z-index:2;animation:bob 2s infinite}
.node.r .me{left:auto;right:36px}
.node .me svg{width:100%;height:100%}
.badges{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.badge{padding:12px 6px;text-align:center;display:flex;flex-direction:column;align-items:center;gap:4px;font-weight:800;font-size:.8rem;line-height:1.15}
.badge .bi{font-size:2.2rem;line-height:1}
.badge.off{opacity:.45;filter:grayscale(1)}

/* onboarding */
.ob{min-height:100%;justify-content:center}
.owl{width:150px;height:150px;animation:bob 2.6s ease-in-out infinite}

.petpick{display:grid;grid-template-columns:repeat(3,1fr);gap:12px}
.petpick button{aspect-ratio:1;font-size:3.2rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px}

/* settings & parent */
.list{display:flex;flex-direction:column}

.toggle.on{background:var(--good)} .toggle.on::after{transform:translateX(24px)}

.ptabs{display:grid;grid-template-columns:repeat(4,1fr);gap:6px;background:var(--paper2);padding:5px;border-radius:18px;border:2px solid var(--line)}

.pcard .chips,.list .chips{flex-wrap:wrap;overflow:visible}
.aicard .field,.pcard .bkcode{width:100%;box-sizing:border-box}
.pgroup{font-family:var(--f-display);font-size:1.15rem;margin:10px 2px 0}
.pgsub{margin:-6px 2px 0;font-weight:700;font-size:.82rem;color:var(--muted)}
.ptiles{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}
.ptile{padding:12px;display:flex;flex-direction:column;gap:2px}

.chart{display:grid;grid-template-columns:repeat(7,1fr);gap:8px;align-items:end;height:130px;padding-top:18px}
.chart .bar{display:flex;flex-direction:column;align-items:center;justify-content:flex-end;gap:4px;height:100%;font-size:.72rem;font-weight:800;color:var(--muted)}

.chart .bar i em{position:absolute;top:-17px;left:50%;transform:translateX(-50%);font-style:normal;color:var(--ink);font-size:.72rem}
.statrow{display:grid;grid-template-columns:1fr auto;gap:4px 8px;padding:10px 0;border-bottom:2px dashed var(--line);font-weight:700;align-items:center}
.statrow:last-child{border-bottom:0}

.meter{grid-column:1/-1;height:8px;border-radius:9px;background:var(--paper2);overflow:hidden}
.meter i{display:block;height:100%}
.pcard{padding:8px 14px}
.pcard>.eyebrow{display:block;margin:8px 0 2px}

/* chat */
.chatlog{display:flex;flex-direction:column;gap:10px;flex:1}
.msg{max-width:86%;padding:10px 14px;border-radius:18px;border:2.5px solid var(--edge);font-weight:700;white-space:pre-wrap;line-height:1.4;animation:popUp .35s cubic-bezier(.3,1.6,.5,1);word-break:break-word}

.msg.bot svg{width:34px;height:34px;flex:none}
.typing i{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--muted);margin:0 2px;animation:typ 1s infinite}

.sugg button{padding:8px 12px;border-radius:14px;border:2px solid var(--edge);background:var(--paper);font-weight:800;font-size:.88rem;box-shadow:0 3px 0 var(--drop)}

#toast{position:fixed;left:50%;top:calc(env(safe-area-inset-top,0px) + 14px);transform:translateX(-50%);z-index:80;pointer-events:none;display:flex;flex-direction:column;gap:8px;align-items:center;width:max-content;max-width:calc(100% - 32px)}

.lbrow b{font-family:var(--f-display);font-size:1.4rem;display:flex;flex-direction:column;align-items:flex-end;line-height:1}.lbrow b small{font-family:var(--f-body);font-size:.68rem;font-weight:700;color:var(--muted)}
.homelb{display:block;width:100%;box-sizing:border-box;padding:12px 14px;text-align:left;font-family:inherit;color:var(--ink);cursor:pointer}.homelb .sec h2{font-size:1.25rem}.lbgap{text-align:center;font-weight:800;color:var(--muted);line-height:.8}.lbrow.me{background:var(--sun-soft);border-radius:12px;padding-inline:8px;margin-inline:-8px}.lbrow.mine .nm{color:var(--accent)}

.brsun{width:20px;height:20px;right:8px;top:8px;background:#FFE066;box-shadow:0 0 12px #FFD23F}

.brbed{transform:translate(-50%,130%)!important;transition:transform 1.1s cubic-bezier(.3,1.25,.5,1)}

/* kométa */
.fxlayer{position:fixed;inset:0;z-index:90;pointer-events:none;overflow:hidden}
.fxflash{position:absolute;inset:0;background:radial-gradient(circle at 50% 40%,#fff,rgba(255,240,180,.85) 40%,rgba(255,200,120,0) 75%);opacity:0;animation:fxflash .9s ease-out .38s}
@keyframes fxflash{0%{opacity:0}12%{opacity:.95}100%{opacity:0}}
.fxcomet{position:absolute;left:-40vw;top:8vh;width:260px;height:14px;transform:rotate(22deg);animation:fxcomet .85s cubic-bezier(.5,0,.6,1) forwards;will-change:transform}
.fxcomet>i{position:absolute;right:0;top:50%;width:54px;height:54px;margin-top:-27px;border-radius:50%;background:radial-gradient(circle,#fff 0 25%,#FFF2A8 45%,#FFC23C 62%,rgba(255,140,40,0) 72%);box-shadow:0 0 30px 14px rgba(255,214,60,.75),0 0 70px 30px rgba(255,140,60,.45);animation:fxpulse .15s ease-in-out infinite alternate}
@keyframes fxpulse{to{transform:scale(1.15)}}
.fxcomet::before{content:"";position:absolute;inset:-6px 20px -6px 0;border-radius:20px;background:linear-gradient(90deg,transparent,rgba(255,150,80,.35) 40%,rgba(255,230,140,.9) 85%,#fff);filter:blur(2px)}
.big .fxcomet::before{background:linear-gradient(90deg,transparent,#FF6A8A 20%,#FFC23C 40%,#2FC08A 60%,#4C86F7 80%,#fff)}
.fxtrail{position:absolute;inset:0}
.fxtrail b{position:absolute;right:30px;top:50%;font-size:18px;color:#FFE066;text-shadow:0 0 8px #FFC23C;opacity:0;animation:fxspark .8s ease-out var(--d) forwards}
.big .fxtrail b:nth-child(3n){color:#FF8FA3}.big .fxtrail b:nth-child(3n+1){color:#86E3C9}
@keyframes fxspark{0%{opacity:1;transform:translate(0,var(--o)) scale(1.2)}100%{opacity:0;transform:translate(-160px,calc(var(--o) * 3 + 30px)) scale(.3) rotate(180deg)}}
@keyframes fxcomet{to{transform:translate(160vw,62vh) rotate(22deg)}}
.fxwave{position:absolute;left:50%;top:38vh;width:40px;height:40px;margin:-20px 0 0 -20px;border-radius:50%;border:6px solid rgba(255,214,60,.9);box-shadow:0 0 24px rgba(255,200,60,.8),inset 0 0 18px rgba(255,255,255,.6);opacity:0;animation:fxwave .8s cubic-bezier(.2,.7,.3,1) .42s forwards}
.fxwave.w2{border-color:rgba(232,69,107,.8);animation-delay:.55s}
.big .fxwave{border-color:#8AD8FF}.big .fxwave.w2{border-color:#FF8FD0}
@keyframes fxwave{0%{opacity:1;transform:scale(.3)}100%{opacity:0;transform:scale(14);border-width:1px}}
.fxstreak{position:absolute;left:50%;top:38vh;transform:translate(-50%,-50%);font-family:var(--f-display);font-weight:900;font-size:2.8rem;color:#fff;white-space:nowrap;text-shadow:0 4px 0 #E8456B,0 0 24px rgba(255,214,60,.9),0 0 50px rgba(232,69,107,.6);opacity:0;animation:fxstreak 1.5s cubic-bezier(.2,1.6,.4,1) .42s forwards}
.big .fxstreak{background:linear-gradient(90deg,#FF6A8A,#FFC23C,#2FC08A,#4C86F7,#B98AFF);-webkit-background-clip:text;background-clip:text;color:transparent;text-shadow:none;filter:drop-shadow(0 4px 0 #33203A)}
@keyframes fxstreak{0%{opacity:0;transform:translate(-50%,-50%) scale(3) rotate(-8deg)}18%{opacity:1;transform:translate(-50%,-50%) scale(.85) rotate(3deg)}30%{transform:translate(-50%,-50%) scale(1.12) rotate(-2deg)}42%,75%{opacity:1;transform:translate(-50%,-50%) scale(1) rotate(0)}100%{opacity:0;transform:translate(-50%,-90%) scale(.9)}}
html.fxshake #app{animation:fxshake .6s cubic-bezier(.36,.07,.19,.97)}
@keyframes fxshake{10%,90%{transform:translate(-2px,1px)}20%,80%{transform:translate(5px,-3px) rotate(.6deg)}30%,50%,70%{transform:translate(-9px,4px) rotate(-1deg)}40%,60%{transform:translate(9px,-4px) rotate(1deg)}}
@media (prefers-reduced-motion: reduce){.fxlayer{display:none}html.fxshake #app{animation:none}}
/* level */
.lvwrap{position:relative;display:grid;place-items:center}
.lvstars{position:absolute;left:50%;top:50%;width:0;height:0}
.lvstars i{position:absolute;left:0;top:0;font-style:normal;font-size:1.4rem;transform:translate(calc(var(--x) - 50%),calc(var(--y) - 50%));opacity:0;animation:lvst .9s cubic-bezier(.6,0,.4,1) forwards}

.cwshadow{position:absolute;left:50%;bottom:-2px;width:80%;height:14px;margin-left:-40%;border-radius:50%;background:rgba(0,0,0,.22);animation:cwsh 2.2s ease both}
@keyframes cwsh{14%{transform:scale(1.15)}38%,50%{transform:scale(.4);opacity:.4}58%{transform:scale(1.25);opacity:1}100%{transform:scale(1)}}
