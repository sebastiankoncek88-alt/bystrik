<title>Bystrík</title>
<meta name="claude:viewport-fit-sides" content="cover">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Baloo+2:wght@600;700;800&family=Nunito:wght@600;700;800;900&display=swap">
<style>
/* Layout: phone-first single column (max 520px) floating over soft pastel gradient with drifting color blobs; sticker cards with hard toy shadows; fixed 4-tab bottom bar */
:root{
  --bg:#FFF6E8; --g1:#FFF6E8; --g2:#FFF1DE; --g3:#FFEAD2; --b1:#FFD3E0; --b2:#CFE3FF; --b3:#D3F2DA; --b4:#FFE9B8; --b5:#E2DCFF;
  --paper:#FFFFFF; --paper2:#FFF4E4; --ink:#23163A; --muted:#6E6280; --line:#F0E4D2; --edge:#EBDDC8; --drop:rgba(35,22,58,.10); --topoc:#23163A; --topoo:.08;
  --accent:#FF7A3D; --accent-ink:#FFFFFF; --accent-d:#D9541C; --sun:#FFC233; --sun-d:#D99B00; --sun-soft:#FFF2C7;
  --good:#2FA36B; --good-soft:#E3F5EA; --bad:#E2457A; --bad-soft:#FFE6EE;
  --c-mat:#3E7BFA; --c-mat-soft:#E3EDFF; --c-sjl:#E2457A; --c-sjl-soft:#FFE6EE; --c-prv:#2FA36B; --c-prv-soft:#E3F5EA; --lilac:#7B6CF6; --lilac-soft:#EEEAFF; --mint-soft:#DDF6EA; --peach-soft:#FFE9DA;
  --f-display:"Baloo 2","Arial Rounded MT Bold","Trebuchet MS",system-ui,sans-serif;
  --f-body:"Nunito",system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;
  --r:24px; --nav-h:70px; --peb:26px 22px 28px 20px / 24px 28px 22px 26px;
}
@media (prefers-color-scheme: dark){:root:not([data-theme="light"]){
  --bg:#1C1640; --g1:#1C1640; --g2:#211A4A; --g3:#261E55; --b1:#4A2E6E; --b2:#26457A; --b3:#1F5048; --b4:#5A4A22; --b5:#3E2F72;
  --paper:#2C2458; --paper2:#251E4C; --ink:#F3EEFF; --muted:#B9AEDB; --line:#3B3270; --edge:#3B3270; --drop:rgba(0,0,0,.35); --topoc:#000; --topoo:.12;
  --accent:#FF8A55; --accent-ink:#2B0F1C; --accent-d:#C9561F; --sun-d:#B98400; --sun:#FFC857; --sun-soft:#4E3F1E;
  --good:#45D893; --good-soft:#1A4637; --bad:#FF7086; --bad-soft:#4E2032;
  --c-mat:#7EA6FF; --c-mat-soft:#2A3C78; --c-sjl:#FF7FA6; --c-sjl-soft:#5A2848; --c-prv:#52D79A; --c-prv-soft:#1D4A3A; --lilac:#B9A0FF; --lilac-soft:#3A2F6E; --mint-soft:#1D4A40; --peach-soft:#4E3028; color-scheme:dark}}
:root[data-theme="dark"]{
  --bg:#1C1640; --g1:#1C1640; --g2:#211A4A; --g3:#261E55; --b1:#4A2E6E; --b2:#26457A; --b3:#1F5048; --b4:#5A4A22; --b5:#3E2F72;
  --paper:#2C2458; --paper2:#251E4C; --ink:#F3EEFF; --muted:#B9AEDB; --line:#3B3270; --edge:#3B3270; --drop:rgba(0,0,0,.35); --topoc:#000; --topoo:.12;
  --accent:#FF8A55; --accent-ink:#2B0F1C; --accent-d:#C9561F; --sun-d:#B98400; --sun:#FFC857; --sun-soft:#4E3F1E;
  --good:#45D893; --good-soft:#1A4637; --bad:#FF7086; --bad-soft:#4E2032;
  --c-mat:#7EA6FF; --c-mat-soft:#2A3C78; --c-sjl:#FF7FA6; --c-sjl-soft:#5A2848; --c-prv:#52D79A; --c-prv-soft:#1D4A3A; --lilac:#B9A0FF; --lilac-soft:#3A2F6E; --mint-soft:#1D4A40; --peach-soft:#4E3028; color-scheme:dark}

html,body{height:100%}
[hidden]{display:none!important}
body{background:var(--bg);background-image:linear-gradient(165deg,var(--g1) 0%,var(--g2) 50%,var(--g3) 100%);background-attachment:fixed;color:var(--ink);font-family:var(--f-body);font-size:16px;line-height:1.4;-webkit-tap-highlight-color:transparent;overscroll-behavior-y:none}
body::before{content:"";position:fixed;inset:0 0 auto;height:env(safe-area-inset-top,0px);z-index:30;background:var(--g1)}
.blobs{position:fixed;inset:0;z-index:-1;overflow:hidden;pointer-events:none}
.blobs i{position:absolute;border-radius:50%;filter:blur(40px);opacity:.75;animation:drift 18s ease-in-out infinite alternate}
.blobs i:nth-child(1){width:260px;height:260px;background:var(--b1);top:-60px;left:-80px}
.blobs i:nth-child(2){width:300px;height:300px;background:var(--b2);top:30%;right:-120px;animation-delay:-5s}
.blobs i:nth-child(3){width:240px;height:240px;background:var(--b3);bottom:-60px;left:10%;animation-delay:-9s}
.blobs i:nth-child(4){width:180px;height:180px;background:var(--b4);top:55%;left:-60px;animation-delay:-3s}
.blobs i:nth-child(5){width:200px;height:200px;background:var(--b5);top:8%;right:20%;animation-delay:-12s}
@keyframes drift{to{transform:translate(40px,30px) scale(1.15)}}
button{font:inherit;color:inherit;border:0;background:none;cursor:pointer;touch-action:manipulation}
button:focus-visible,[tabindex]:focus-visible,input:focus-visible{outline:3px solid var(--sun);outline-offset:3px}
h1,h2,h3{font-family:var(--f-display);margin:0;line-height:1.1;text-wrap:balance}
p{margin:0}
.app{max-width:520px;margin:0 auto;min-height:100%;position:relative;display:flex;flex-direction:column}
.view{flex:1;padding-left:max(16px,env(safe-area-inset-left,0px));padding-right:max(16px,env(safe-area-inset-right,0px));padding-block:10px calc(var(--nav-h) + 30px + env(safe-area-inset-bottom,0px));display:flex;flex-direction:column;gap:16px}
.view.nonav{padding-bottom:calc(24px + env(safe-area-inset-bottom,0px))}
.view.peekpad{padding-bottom:calc(110px + env(safe-area-inset-bottom,0px))}
.vghost *{animation-play-state:paused!important}.vghost *{transition:none!important}.vghost{contain:layout paint}
.enter-f{animation:inF .26s ease-out} .enter-b{animation:inB .26s ease-out} .enter-u{animation:inU .3s cubic-bezier(.2,.9,.3,1.1)}
.enter-r{animation:inR .2s ease-out} .enter-l{animation:inL .2s ease-out}
@keyframes inR{from{opacity:0;transform:translateX(18px)}} @keyframes inL{from{opacity:0;transform:translateX(-18px)}}
.enter-r.pop-in>*,.enter-l.pop-in>*{animation:none}
.vghost{animation-duration:.16s;animation-fill-mode:forwards;animation-timing-function:cubic-bezier(.4,0,.7,.4)}
.vghost *{animation:none!important}
.out-f,.out-r{animation-name:outL} .out-b,.out-l{animation-name:outR} .out-u{animation-name:outD}
@keyframes outL{to{opacity:0;transform:translateX(-14px)}} @keyframes outR{to{opacity:0;transform:translateX(14px)}} @keyframes outD{to{opacity:0;transform:scale(.93) translateY(-14px)}}

@keyframes inF{from{opacity:0;transform:translateX(28px)}} @keyframes inB{from{opacity:0;transform:translateX(-28px)}} @keyframes inU{from{opacity:0;transform:translateY(30px) scale(.96)}}
.pop-in>*{animation:popUp .5s backwards cubic-bezier(.3,1.6,.5,1)}
.pop-in>*:nth-child(2){animation-delay:.06s}.pop-in>*:nth-child(3){animation-delay:.12s}.pop-in>*:nth-child(4){animation-delay:.18s}.pop-in>*:nth-child(5){animation-delay:.24s}.pop-in>*:nth-child(6){animation-delay:.3s}.pop-in>*:nth-child(7){animation-delay:.36s}.pop-in>*:nth-child(8){animation-delay:.42s}
@keyframes popUp{from{opacity:0;transform:translateY(18px) scale(.9)}}

.card{background:var(--paper);border:2.5px solid var(--edge);border-radius:var(--r);box-shadow:0 5px 0 var(--drop)}
.btn{font-family:var(--f-display);font-weight:800;font-size:1.15rem;display:inline-flex;align-items:center;justify-content:center;gap:8px;min-height:56px;padding:8px 22px;border-radius:18px;border:2.5px solid var(--edge);box-shadow:0 5px 0 var(--drop);background:var(--paper);transition:transform .1s,box-shadow .1s}
.btn:active,.press:active{transform:translateY(4px) scale(.98);box-shadow:0 1px 0 var(--drop)}
.btn.primary{background:var(--accent);color:var(--accent-ink)} .btn.sun{background:var(--sun);color:#2A2650} .btn.good{background:var(--good);color:#fff} .btn.lilac{background:var(--lilac);color:#fff}
.btn.block{width:100%} .btn.small{min-height:44px;font-size:1rem;padding:6px 16px;border-radius:14px}
.btn[disabled]{opacity:.45;pointer-events:none}
.eyebrow{font-family:var(--f-display);font-weight:700;font-size:.82rem;letter-spacing:.08em;text-transform:uppercase;color:var(--muted)}
.muted{color:var(--muted)} .b{font-weight:800}
.sec{display:flex;align-items:baseline;justify-content:space-between;gap:8px}
.sec h2{font-size:1.35rem}

:root.fdark{
  --bg:#1C1640; --g1:#1C1640; --g2:#211A4A; --g3:#261E55; --b1:#4A2E6E; --b2:#26457A; --b3:#1F5048; --b4:#5A4A22; --b5:#3E2F72;
  --paper:#2C2458; --paper2:#251E4C; --ink:#F3EEFF; --muted:#B9AEDB; --line:#3B3270; --edge:#3B3270; --drop:rgba(0,0,0,.35); --topoc:#000; --topoo:.12;
  --accent:#FF8A55; --accent-ink:#2B0F1C; --accent-d:#C9561F; --sun-d:#B98400; --sun:#FFC857; --sun-soft:#4E3F1E;
  --good:#45D893; --good-soft:#1A4637; --bad:#FF7086; --bad-soft:#4E2032;
  --c-mat:#7EA6FF; --c-mat-soft:#2A3C78; --c-sjl:#FF7FA6; --c-sjl-soft:#5A2848; --c-prv:#52D79A; --c-prv-soft:#1D4A3A; --lilac:#B9A0FF; --lilac-soft:#3A2F6E; --mint-soft:#1D4A40; --peach-soft:#4E3028; color-scheme:dark}
.roombg{position:absolute;inset:0;overflow:hidden}
.roombg .pat{position:absolute;inset:0}
.pat-bodky{background-image:radial-gradient(rgba(255,255,255,.85) 17%,transparent 19%),radial-gradient(rgba(60,40,120,.08) 17%,transparent 19%);background-size:30px 30px;background-position:0 0,15px 15px}
.pat-pruhy{background-image:repeating-linear-gradient(45deg,rgba(255,255,255,.6) 0 12px,transparent 12px 30px)}
.pat-kocky{background-image:linear-gradient(45deg,rgba(255,255,255,.55) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.55) 75%),linear-gradient(45deg,rgba(255,255,255,.55) 25%,transparent 25%,transparent 75%,rgba(255,255,255,.55) 75%);background-size:40px 40px;background-position:0 0,20px 20px}
.pat-vlnky{background-image:radial-gradient(circle at 50% 0,transparent 13px,rgba(255,255,255,.65) 14px 18px,transparent 19px);background-size:36px 22px}
.pat-mriezka{background-image:linear-gradient(rgba(255,255,255,.6) 2px,transparent 2px),linear-gradient(90deg,rgba(255,255,255,.6) 2px,transparent 2px);background-size:34px 34px}
.pat.onDark{opacity:.25}
.stk{position:absolute;transform:translate(-50%,-50%) rotate(var(--r)) scale(var(--s));font-size:var(--rs,34px);line-height:1;user-select:none;-webkit-user-select:none}
#pagebg{position:fixed;inset:0;z-index:-1;pointer-events:none}
.rscene{position:absolute;inset:0;pointer-events:none}.rscene i{position:absolute;display:block}
#pagebg .rscene{display:none}
.roombg .pat{opacity:.45}
.rlight{left:50%;top:-10%;width:130%;height:95%;transform:translateX(-50%);background:radial-gradient(ellipse 45% 55% at 50% 45%,rgba(255,255,255,.85),rgba(255,255,255,0) 70%);animation:rlight 6s ease-in-out infinite}
@keyframes rlight{50%{opacity:.7}}
.rwin{right:7%;top:9%;width:62px;height:72px;border:3px solid var(--edge);border-radius:32px 32px 8px 8px;background:linear-gradient(180deg,#BFE6FF,#E9F7FF 70%);box-shadow:inset 0 -14px 0 rgba(255,255,255,.6),0 4px 0 var(--drop);opacity:.95}
.rwin::before{content:"";position:absolute;left:50%;top:0;bottom:0;width:3px;background:var(--edge);transform:translateX(-50%)}
.rwin::after{content:"";position:absolute;left:0;right:0;top:46%;height:3px;background:var(--edge)}
.rfloor{left:-5%;right:-5%;bottom:0;height:24%;background:linear-gradient(180deg,color-mix(in srgb,var(--floor) 85%,#fff),var(--floor));border-top:3px solid color-mix(in srgb,var(--floor) 60%,#33203A);border-radius:50% 50% 0 0/22px 22px 0 0}
.rfloor::before{content:"";position:absolute;inset:0;background:repeating-linear-gradient(90deg,transparent 0 46px,rgba(0,0,0,.06) 46px 49px);border-radius:inherit}
.rrug{left:50%;bottom:4%;width:200px;height:34px;transform:translateX(-50%);border-radius:50%;background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.75),rgba(255,255,255,.35) 55%,rgba(0,0,0,.12) 72%,transparent 74%)}
.rdust{inset:0;background-image:radial-gradient(circle,rgba(255,255,255,.9) 1.4px,transparent 2px),radial-gradient(circle,rgba(255,255,255,.7) 1px,transparent 1.6px);background-size:90px 110px,60px 80px;background-position:10px 20px,40px 5px;opacity:.6}
@keyframes rdust{to{background-position:10px -200px,40px -235px}}
.int-nic{display:none}
.roombg:has(.int-nic) .pat{opacity:1}
/* trieda */
.int-trieda .rwin{left:50%;right:auto;top:7%;width:58%;height:30%;transform:translateX(-50%);border-radius:8px;background:#2F6B4F;border:5px solid #9A6A3A;box-shadow:0 4px 0 var(--drop),inset 0 0 0 2px rgba(255,255,255,.08)}
.int-trieda .rwin::before{content:"1 + 2 = 3   ★   A B C";width:auto;left:8%;right:8%;top:22%;bottom:auto;background:none;transform:none;color:rgba(255,255,255,.85);font:700 15px/1.2 var(--f-display);white-space:nowrap;overflow:hidden;text-align:center}
.int-trieda .rwin::after{left:10%;right:auto;top:auto;bottom:-9px;width:30%;height:5px;background:#E8DCC6;border-radius:3px}
.int-trieda .rfloor{--floor:#D9A066}
.int-trieda .rfloor::before{background:repeating-linear-gradient(90deg,transparent 0 38px,rgba(90,50,10,.18) 38px 40px)}
.int-trieda .rrug{background:radial-gradient(ellipse at 50% 40%,rgba(255,255,255,.45),transparent 70%)}
/* lúka */
.int-les .rwin{right:9%;top:8%;width:54px;height:54px;border-radius:50%;border:0;background:radial-gradient(circle,#FFE680 0 55%,#FFC93C 70%);box-shadow:0 0 0 10px rgba(255,214,60,.25),0 0 40px #FFD23F;animation:rsun 6s ease-in-out infinite}
.int-les .rwin::before,.int-les .rwin::after{display:none}
.int-les .rfloor{--floor:#7FD07A;border-radius:60% 40% 0 0/30px 26px 0 0;border-top-color:#4FA64F}
.int-les .rfloor::before{background:radial-gradient(circle at 15% 30%,#FF8FA3 0 4px,transparent 5px),radial-gradient(circle at 38% 60%,#FFE066 0 4px,transparent 5px),radial-gradient(circle at 70% 35%,#fff 0 4px,transparent 5px),radial-gradient(circle at 88% 65%,#C9A0FF 0 4px,transparent 5px)}
.int-les .rlight::after{content:"";position:absolute;left:12%;bottom:18%;width:70px;height:110px;background:radial-gradient(circle at 50% 32%,#5DBB63 0 34px,transparent 35px),linear-gradient(90deg,transparent 30px,#9A6A3A 30px 40px,transparent 40px)}
.int-les .rrug{background:radial-gradient(ellipse at 50% 40%,rgba(0,80,0,.18),transparent 70%)}
/* pláž */
.int-plaz .rwin{right:9%;top:8%;width:54px;height:54px;border-radius:50%;border:0;background:radial-gradient(circle,#FFE680 0 55%,#FFB13C 70%);box-shadow:0 0 0 10px rgba(255,190,60,.25),0 0 40px #FFC23C;animation:rsun 6s ease-in-out infinite}
.int-plaz .rwin::before,.int-plaz .rwin::after{display:none}
.int-plaz .rfloor{--floor:#F6D79B;border-top-color:#E0B66A}
.int-plaz .rfloor::after{content:"";position:absolute;left:0;right:0;top:-34px;height:34px;background:linear-gradient(180deg,#5EC8E8,#3AA8D8);border-top:3px solid #fff;animation:rwave 3s ease-in-out infinite}
.int-plaz .rfloor::before{background:radial-gradient(circle at 20% 60%,#fff 0 3px,transparent 4px),radial-gradient(circle at 75% 40%,#FF9F8A 0 4px,transparent 5px)}
/* mesiac */
.int-vesmir{background:radial-gradient(circle at 20% 15%,#fff 0 1.5px,transparent 2px) 0 0/70px 60px,radial-gradient(circle at 60% 50%,#fff 0 1px,transparent 1.6px) 0 0/50px 45px,linear-gradient(180deg,rgba(20,18,60,.88),rgba(40,30,90,.7))}
.int-vesmir .rwin{right:8%;top:9%;width:58px;height:58px;border-radius:50%;border:3px solid var(--edge);background:radial-gradient(circle at 35% 30%,#FFC7E0,#D96BA8);box-shadow:none}
.int-vesmir .rwin::before{left:-16px;right:-16px;top:44%;bottom:auto;width:auto;height:8px;transform:rotate(-14deg);border-radius:50%;background:none;border:3px solid #FFD84D}
.int-vesmir .rwin::after{display:none}
.int-vesmir .rfloor{--floor:#B9B6CC;border-top-color:#8D89A6}
.int-vesmir .rfloor::before{background:radial-gradient(ellipse at 18% 50%,rgba(0,0,0,.18) 0 12px,transparent 13px),radial-gradient(ellipse at 80% 40%,rgba(0,0,0,.15) 0 9px,transparent 10px),radial-gradient(ellipse at 60% 75%,rgba(0,0,0,.12) 0 6px,transparent 7px)}
.int-vesmir .rlight{background:radial-gradient(ellipse 40% 50% at 50% 45%,rgba(180,170,255,.45),transparent 70%)}
/* zámok */
.int-zamok{background:linear-gradient(180deg,rgba(0,0,0,0) 0,rgba(0,0,0,0) 100%),repeating-linear-gradient(0deg,transparent 0 26px,rgba(80,70,90,.22) 26px 28px),repeating-linear-gradient(90deg,transparent 0 52px,rgba(80,70,90,.16) 52px 54px)}
.int-zamok .rwin{left:9%;right:auto;top:8%;width:46px;height:70px;border-radius:24px 24px 4px 4px;background:linear-gradient(180deg,#6FA8FF,#BFE0FF)}
.int-zamok .rlight::after{content:"";position:absolute;right:13%;top:16%;width:34px;height:48px;background:linear-gradient(90deg,#33203A 0 3px,transparent 3px),linear-gradient(180deg,#E8456B 0 60%,transparent 60%);clip-path:polygon(0 0,100% 0,100% 60%,55% 45%,10% 60%,10% 100%,0 100%)}
.int-zamok .rfloor{--floor:#B48A5E;border-top-color:#7A5634}
.int-zamok .rrug{width:150px;height:24%;bottom:0;border-radius:10px 10px 0 0;background:linear-gradient(90deg,#C8324F,#E8456B 50%,#C8324F);clip-path:polygon(30% 0,70% 0,100% 100%,0 100%);opacity:.85}
@keyframes rsun{50%{transform:scale(1.08)}}@keyframes rwave{50%{transform:translateY(3px)}}
.ints button{position:relative;min-height:92px;overflow:hidden;padding:0;display:flex;align-items:flex-end}
.intprev{position:absolute;inset:0;pointer-events:none}.intprev .roombg{position:absolute;inset:0}
.intprev .rwin{transform:scale(.6);transform-origin:top right}.intprev.int-trieda .rwin{transform:translateX(-50%) scale(.6)}
.intn{position:relative;width:100%;background:var(--paper);border-top:2px solid var(--edge);font-weight:800;font-size:.8rem;padding:4px 2px;color:var(--ink)}
.wardstage .rwin,.roomprev .rwin{display:none}
.stage .stk,.wardstage .stk,.roomprev .stk{filter:drop-shadow(0 4px 3px rgba(0,0,0,.18))}
.stage .stk{--rs:30px}

@media (prefers-reduced-motion: reduce){.rlight,.rdust{animation:none}}

#pagebg .stk{opacity:.5;--rs:56px}
.stage .stk{--rs:34px;animation:floaty 5s ease-in-out infinite}
.stage .stk:nth-child(2n){animation-delay:-2s}
@keyframes floaty{50%{translate:0 -6px}}
.designer{position:relative;height:min(50vh,430px);aspect-ratio:3/4;max-width:100%;margin:0 auto;border-radius:var(--r);border:2.5px solid var(--edge);box-shadow:0 5px 0 var(--drop);overflow:hidden;touch-action:none}
.designer .stk{cursor:grab;touch-action:none;--rs:42px;transition:outline .1s}
.designer .stk.sel{outline:3px dashed var(--accent);outline-offset:5px;border-radius:10px}
.designer .dfig{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:76%;pointer-events:none}
.designer .dfig svg{height:100%;width:auto}
.stkpal{display:grid;grid-template-columns:repeat(6,1fr);gap:8px}
.stkpal button{aspect-ratio:1;font-size:1.7rem;border-radius:14px;border:2px solid var(--edge);background:var(--paper);box-shadow:0 3px 0 var(--drop);position:relative;padding:0}
.themes{display:grid;grid-template-columns:repeat(4,1fr);gap:10px}
.themes button{aspect-ratio:1;border-radius:16px;border:2.5px solid var(--edge);box-shadow:0 3px 0 var(--drop);position:relative;font-size:.68rem;font-weight:800;display:flex;align-items:flex-end;justify-content:center;padding:4px;line-height:1.05;color:#2A2650;overflow:hidden}
.themes button.dk{color:#fff}
.themes button.on{outline:4px solid var(--accent);outline-offset:2px}
.lockb::after{content:"🔒";position:absolute;inset:0;display:grid;place-items:center;background:rgba(20,16,50,.45);border-radius:inherit;font-size:1.1rem}
.stktools{display:grid;grid-template-columns:repeat(4,1fr);gap:8px}
.stktools .btn{min-height:46px;font-size:.9rem;padding:4px;border-radius:14px}
.wardstage .fig{position:relative}
.wardstage .fig svg{position:relative}
.roomprev{position:relative;height:200px;border-radius:var(--r);overflow:hidden;border:2.5px solid var(--edge)}
.roomprev .dfig{position:absolute;left:50%;bottom:0;transform:translateX(-50%);height:90%}
.roomprev .dfig svg{height:100%;width:auto}

/* shop + čítanka */
.lvl.coinchip{background:var(--paper);color:var(--ink);cursor:pointer}
.shophead{display:flex;align-items:center;gap:14px;padding:14px;background:var(--sun-soft)}
.shophead .coinbig{font-size:3rem;animation:wig 2.4s infinite}
.shophead b{font-family:var(--f-display);font-size:2.2rem;line-height:1;display:block}
.shopgrid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.shopitem{padding:10px;display:flex;flex-direction:column;align-items:center;gap:6px;text-align:center}
.shopitem .th{width:100%;aspect-ratio:1.2;border-radius:16px;background:var(--paper2);overflow:hidden;display:grid;place-items:center;font-size:3.2rem;border:2px dashed var(--line)}
.shopitem .th svg{width:100%;height:100%}
.shopitem b{font-family:var(--f-display);font-size:1rem;line-height:1.1}
.shopitem .btn{width:100%}
.shopitem.own .th{border:2px solid var(--good);background:var(--good-soft)}
.shopitem .tag{font-weight:800;font-size:.8rem;color:var(--good)}
.btn[aria-disabled="true"]{opacity:.55}
.readtext{padding:18px;font-size:1.25rem;line-height:1.65;font-weight:700}
.readtext.g1{font-size:1.6rem;line-height:1.7;font-family:var(--f-display)} .readtext.g2{font-size:1.4rem}
.recbtn.on{background:var(--bad);color:#fff;animation:pulse 1.2s infinite}
.rq{display:flex;flex-direction:column;gap:8px}
.rq .opt{min-height:52px}
/* tutorial + parent texts */
.tutsheet{position:fixed;left:0;right:0;bottom:0;z-index:45;padding:14px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));background:var(--paper);border-top:3px solid var(--edge);border-radius:26px 26px 0 0;box-shadow:0 -8px 30px rgba(20,16,50,.25);animation:up .35s cubic-bezier(.2,.9,.3,1.15)}
.tutsheet .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:12px}
.tutrow{display:flex;gap:12px;align-items:center}
.tutrow p{font-weight:800;font-size:1.1rem;line-height:1.35}
.tutemoji{font-size:2.8rem;line-height:1;animation:wig 1.6s infinite;flex:none}
.tutfocus{outline:5px solid #FFC94D;outline-offset:5px;border-radius:18px;animation:tutpulse 1.1s ease-in-out infinite;position:relative;z-index:40;box-shadow:0 0 0 5px #FF7A59,0 0 0 200vmax rgba(12,10,40,.62)!important}
@keyframes tutpulse{50%{outline-offset:11px;outline-color:#fff}}

html{background-color:var(--pg,var(--bg))!important}

body::after{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:var(--topoc,var(--ink));opacity:var(--topoo,.12);-webkit-mask:var(--topo) 0 0/560px 560px repeat;mask:var(--topo) 0 0/560px 560px repeat}
body::before{background:var(--pg,var(--bg))!important}
.blobs,#pagebg{display:none!important}
.top{background:color-mix(in srgb,var(--pg,var(--bg)) 82%,transparent)!important}
.grades button,.grades button b{color:#2A2650!important}
.list .swatches{display:flex;flex-wrap:wrap;gap:10px}
.list .swatches .sw{width:40px;height:40px;min-width:40px;border-radius:50%;border:2.5px solid var(--edge);box-shadow:0 3px 0 var(--drop);padding:0;cursor:pointer}
.list .swatches .sw.on{outline:4px solid var(--accent);outline-offset:2px}
.sw.swauto{background-image:linear-gradient(135deg,transparent 45%,rgba(128,128,128,.5) 45% 55%,transparent 55%)!important}

.chip{flex:none;font-family:var(--f-display);font-weight:800;padding:8px 16px;border-radius:99px;border:2.5px solid var(--edge);background:var(--paper);box-shadow:0 3px 0 var(--drop);white-space:nowrap}
.chip.on{background:var(--ink);color:var(--bg)}

/* subject */
.modepick{display:grid;grid-template-columns:repeat(3,minmax(0,1fr));gap:8px}
.mp{display:flex;flex-direction:column;align-items:center;gap:2px;padding:10px 2px 8px;border-radius:18px;border:2.5px solid var(--edge);background:var(--paper);box-shadow:0 4px 0 var(--drop);font-family:var(--f-display);font-weight:800;font-size:.78rem;line-height:1.05;text-align:center}
.mp .mi{font-size:1.7rem;line-height:1;transition:transform .3s cubic-bezier(.3,1.8,.5,1)}
.mp.on{background:var(--sun);color:#2A2650;transform:translateY(-3px)} .mp.on .mi{transform:scale(1.2) rotate(-8deg)}
.modehelp{display:flex;gap:10px;align-items:center;padding:10px 12px;background:var(--paper2);border:2px dashed var(--line);border-radius:16px;font-weight:700;font-size:.9rem}
.topics{display:flex;flex-direction:column;gap:12px}
.topic{display:flex;align-items:center;gap:12px;padding:12px 14px;text-align:left;width:100%}
.topic .ti{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;font-size:1.7rem;flex:none;border:2px solid var(--edge)}
.topic .tn{flex:1;min-width:0;font-weight:800;font-size:1.05rem;line-height:1.2}
.topic .tn small{display:block;font-weight:700;color:var(--muted);font-size:.82rem;margin-top:3px}
.topic.na{opacity:.5}
.topic .go{font-family:var(--f-display);font-weight:800;background:var(--accent);color:var(--accent-ink);border:2px solid var(--edge);border-radius:12px;padding:4px 10px;font-size:.9rem}

/* sheet */
.scrim{position:fixed;inset:0;background:rgba(20,16,50,.45);z-index:40;animation:fade .2s}
@keyframes fade{from{opacity:0}}
.sheet{position:fixed;left:0;right:0;bottom:0;z-index:41;background:var(--paper);border-top:2.5px solid var(--edge);border-radius:26px 26px 0 0;padding:10px max(16px,env(safe-area-inset-right,0px)) calc(20px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));animation:up .35s cubic-bezier(.2,.9,.3,1.15);max-width:520px;margin:0 auto;max-height:88vh;overflow:auto}
@keyframes up{from{transform:translateY(100%)}}
.sheet .grab{width:48px;height:5px;border-radius:9px;background:var(--line);margin:0 auto 12px}
.sheet h2{font-size:1.5rem;margin-bottom:6px}

/* quiz */
.qtop{display:flex;align-items:center;gap:12px}
.prog{flex:1;height:16px;border-radius:99px;border:2.5px solid var(--edge);background:var(--paper);overflow:hidden}
.prog i{display:block;height:100%;background:linear-gradient(90deg,var(--good),#7EE0A8);transition:width .45s cubic-bezier(.2,.8,.25,1);border-radius:99px}
.mini{width:54px;height:54px;flex:none}
.mini svg{width:100%;height:100%;border-radius:50%;border:2.5px solid var(--edge);background:var(--paper)}
.combo{font-family:var(--f-display);font-weight:800;color:var(--accent);min-width:44px;text-align:right;font-size:1.1rem}
.combo.pop{animation:popc .5s cubic-bezier(.3,1.8,.5,1)} @keyframes popc{40%{transform:scale(1.6) rotate(-8deg)}}
.qcard{padding:22px 18px;display:flex;flex-direction:column;align-items:center;gap:12px;text-align:center;min-height:200px;justify-content:center;position:relative}
.qcard.enter{animation:qin .45s cubic-bezier(.2,.9,.3,1.25)} @keyframes qin{from{opacity:0;transform:translateY(20px) rotate(-2deg) scale(.94)}}
.qtext{font-family:var(--f-display);font-weight:700;font-size:1.45rem;line-height:1.2;max-width:28ch}
.qtext.eq{font-size:2.6rem;font-weight:800;letter-spacing:.02em}
.speak{position:absolute;top:10px;right:10px;width:42px;height:42px;border-radius:12px;border:2px solid var(--line);display:grid;place-items:center;font-size:1.2rem;background:var(--paper2)}
.qsvg{width:150px;height:150px;color:var(--ink)} .qsvg.wide{width:200px;height:170px}
img.emo{width:1.18em;min-width:1.18em;height:1.18em;flex:none;vertical-align:-.24em;display:inline-block;object-fit:contain;pointer-events:none;user-select:none;-webkit-user-drag:none}
.bigemoji{font-size:5.5rem;line-height:1;animation:wob 2.6s ease-in-out infinite} @keyframes wob{50%{transform:rotate(-6deg) scale(1.06)}}
.caption{font-family:var(--f-display);font-weight:800;font-size:1.7rem;letter-spacing:.12em;color:var(--muted)}
.bigeq{font-family:var(--f-display);font-weight:800;font-size:2.6rem} .bigeq.small{font-size:1.9rem}
.bigword{font-family:var(--f-display);font-weight:800;font-size:2.8rem;letter-spacing:.04em}
.slot{display:inline-block;min-width:1.1em;border-bottom:4px solid var(--accent);color:var(--accent)}
.hint{font-size:.85rem;color:var(--muted);font-weight:700}
.countgrid{display:flex;flex-wrap:wrap;justify-content:center;gap:6px;max-width:260px;font-size:2.1rem}
.countgrid span{animation:popin .35s backwards cubic-bezier(.3,1.6,.5,1)} @keyframes popin{from{transform:scale(0)}}
.coins{display:flex;flex-wrap:wrap;gap:8px;justify-content:center}
.coin{width:62px;height:62px;border-radius:50%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;background:#F2C14E;color:#5A3D00;border:3px solid #C99511;animation:popin .35s backwards}
.coin.c1{background:#E6E8EE;border-color:#B0B4C4;color:#33364A}.coin.c5,.coin.c10{border-radius:10px;width:86px;height:50px;background:#C9E7D1;border-color:#5FA77A;color:#1F4D2E}.coin.c10{background:#F8C9C2;border-color:#D46A5A;color:#5A1E14}
.opts{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.opts.one{grid-template-columns:1fr}
.opt{min-height:68px;font-family:var(--f-display);font-weight:800;font-size:1.35rem;padding:10px;border-radius:18px;border:2.5px solid var(--edge);background:var(--paper);box-shadow:0 5px 0 var(--drop);transition:transform .1s,box-shadow .1s,background .2s;line-height:1.15;word-break:break-word}
.opt.long{font-size:1.05rem}
.opt:active{transform:translateY(4px) scale(.97);box-shadow:0 1px 0 var(--drop)}
.opt.right{background:var(--good);color:#fff;animation:yay .55s cubic-bezier(.3,1.8,.5,1)} @keyframes yay{40%{transform:scale(1.08) rotate(-2deg)}}
.opt.wrong{background:var(--bad);color:#fff;animation:shake .45s}
.opt.dim{opacity:.4}
.opts.locked .opt{pointer-events:none}
.pad{display:flex;flex-direction:column;gap:10px}
.padshow{font-family:var(--f-display);font-weight:800;font-size:2.2rem;text-align:center;min-height:64px;padding:4px;border-radius:18px;border:2.5px dashed var(--edge);background:var(--paper)}
.padshow.right{background:var(--good);color:#fff;border-style:solid}.padshow.wrong{background:var(--bad);color:#fff;border-style:solid;animation:shake .45s}
.keys{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.key{min-height:56px;font-family:var(--f-display);font-weight:800;font-size:1.6rem;border-radius:16px;border:2.5px solid var(--edge);background:var(--paper);box-shadow:0 4px 0 var(--drop)}
.key:active{transform:translateY(3px);box-shadow:0 1px 0 var(--drop)}
.key.ok{background:var(--good);color:#fff}.key.del{background:var(--paper2)}.key.op{background:var(--lilac-soft)}.key.eq{background:var(--accent);color:#fff}
.fb{position:fixed;left:0;right:0;bottom:0;z-index:33;padding:16px max(16px,env(safe-area-inset-right,0px)) calc(16px + env(safe-area-inset-bottom,0px)) max(16px,env(safe-area-inset-left,0px));border-top:2.5px solid var(--edge);border-radius:24px 24px 0 0;animation:up .32s cubic-bezier(.2,.9,.3,1.15);max-height:80vh;overflow:auto}
.fb .in{max-width:520px;margin:0 auto;display:flex;flex-direction:column;gap:10px}
.fb.ok{background:var(--good-soft)} .fb.no{background:var(--bad-soft)}
.fbtop{display:flex;align-items:center;gap:10px}
.fbbear{flex:none;width:112px;height:112px;animation:fbpop .55s cubic-bezier(.3,1.7,.5,1)}
.fbbear svg{width:100%;height:100%;filter:drop-shadow(0 5px 0 rgba(0,0,0,.12))}
@keyframes fbpop{0%{transform:translateY(70px) scale(.4);opacity:0}60%{transform:translateY(-10px) scale(1.08);opacity:1}}
.fbbub{position:relative;flex:1;background:var(--paper);border:2px solid var(--edge);border-radius:18px 18px 18px 4px;padding:10px 12px;box-shadow:0 4px 0 var(--drop);animation:fbbub .4s .18s backwards cubic-bezier(.3,1.6,.5,1)}
@keyframes fbbub{from{transform:scale(.6);opacity:0}}
.fbbub h3{font-size:1.2rem!important;line-height:1.2}
.evsum{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.evsum>div{border-radius:16px;padding:10px;text-align:center;border:2px solid var(--line)}
.evsum .ok{background:var(--good-soft)}.evsum .no{background:var(--bad-soft)}
.evsum b{display:block;font-family:var(--f-display);font-size:2rem;line-height:1}.evsum span{font-weight:700;font-size:.85rem}
.evrep{background:var(--sun-soft);border:2px solid var(--line);border-radius:16px;padding:12px;display:flex;flex-direction:column;gap:8px}
.tlog h3{font-size:1.1rem;margin-top:4px}
.evt{display:flex;justify-content:space-between;align-items:center;gap:8px;font-weight:800}.evt small{font-weight:700;opacity:.7;white-space:nowrap}
.evok summary{font-family:var(--f-display);font-weight:800;font-size:1.1rem;cursor:pointer;padding:6px 0}
.evok[open]{display:flex;flex-direction:column;gap:8px}
.fb h3{font-size:1.5rem;display:flex;align-items:center;gap:8px}
.fb.ok h3{color:var(--good)} .fb.no h3{color:var(--bad)}
.fb p{font-weight:700}
.explain{background:var(--paper);border:2px solid var(--edge);border-radius:16px;padding:10px 12px;font-weight:700;display:flex;gap:10px;align-items:flex-start;white-space:pre-wrap}
.explain svg{width:38px;height:38px;flex:none}
.timer{font-family:var(--f-display);font-weight:800;font-size:1.2rem;min-width:64px;text-align:center;padding:2px 10px;border-radius:12px;border:2.5px solid var(--edge);background:var(--paper);white-space:nowrap}
.timer.low{background:var(--bad);color:#fff;animation:pulse .6s infinite}

/* peeking pet + calculator */
.peek{position:fixed;left:max(10px,env(safe-area-inset-left,0px));bottom:calc(-26px + env(safe-area-inset-bottom,0px));z-index:31;width:92px;height:92px;font-size:76px;line-height:92px;text-align:center;animation:peekin .7s cubic-bezier(.3,1.6,.5,1) .3s backwards,peekbob 2.4s ease-in-out 1s infinite;filter:drop-shadow(0 4px 0 rgba(0,0,0,.15))}
@keyframes peekin{from{transform:translateY(120%)}} @keyframes peekbob{50%{transform:translateY(-6px) rotate(-4deg)}}
.peek.happy{animation:peekyay .6s cubic-bezier(.3,1.8,.5,1)} @keyframes peekyay{40%{transform:translateY(-34px) rotate(10deg) scale(1.1)}}
.peekbub{position:fixed;left:calc(max(10px,env(safe-area-inset-left,0px)) + 84px);bottom:calc(40px + env(safe-area-inset-bottom,0px));z-index:31;background:var(--paper);border:2.5px solid var(--edge);border-radius:16px 16px 16px 4px;padding:6px 10px;font-weight:800;font-size:.85rem;box-shadow:0 3px 0 var(--drop);animation:popUp .4s cubic-bezier(.3,1.6,.5,1);max-width:200px;pointer-events:none}
.calcshow{font-family:var(--f-display);font-weight:800;font-size:2.2rem;text-align:right;padding:6px 14px;border-radius:16px;border:2.5px solid var(--edge);background:var(--paper2);min-height:64px;overflow:hidden;white-space:nowrap;text-overflow:ellipsis}
.calcshow small{display:block;font-size:.95rem;color:var(--muted);min-height:1.2em}
.keys.c4{grid-template-columns:repeat(4,1fr)}

/* cards */
.flip{perspective:1200px;height:320px}
.flip .inner{position:relative;width:100%;height:100%;transition:transform .6s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.flip.on .inner{transform:rotateY(180deg)}
.face{position:absolute;inset:0;backface-visibility:hidden;-webkit-backface-visibility:hidden;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:10px;padding:18px;text-align:center}
.face.back{transform:rotateY(180deg);background:var(--sun-soft)}
.face .ft{font-family:var(--f-display);font-weight:800;font-size:1.7rem;line-height:1.2}
.face .ft.huge{font-size:2.8rem}
.face .tap{position:absolute;bottom:12px;font-size:.85rem;font-weight:800;color:var(--muted)}
.cq{font-family:var(--f-display);font-weight:700;font-size:1.1rem}
.cardnav{display:grid;grid-template-columns:1fr 1fr;gap:12px}
.deckinfo{text-align:center;font-weight:800;color:var(--muted);font-size:.9rem}
.flyL{animation:flyL .35s forwards} .flyR{animation:flyR .35s forwards}
@keyframes flyL{to{transform:translateX(-120%) rotate(-14deg);opacity:0}} @keyframes flyR{to{transform:translateX(120%) rotate(14deg);opacity:0}}

/* pexeso */
.pex{display:grid;grid-template-columns:repeat(3,1fr);gap:10px}
.tile{display:block;width:100%;padding:0;aspect-ratio:1/1.05;perspective:800px;max-width:100%}
.tile .inner{display:block;position:relative;width:100%;height:100%;transition:transform .45s cubic-bezier(.3,1.4,.5,1);transform-style:preserve-3d}
.tile.on .inner,.tile.done .inner{transform:rotateY(180deg)}
.tile .face{border-radius:16px;border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--drop);padding:6px}
.tile .face.front{background:linear-gradient(140deg,var(--lilac),var(--c-sjl));color:#fff;font-family:var(--f-display);font-weight:800;font-size:2rem}
.tile .face.back{background:var(--paper);font-family:var(--f-display);font-weight:800;font-size:1.05rem;line-height:1.1;word-break:break-word}
.tile .face.back.e{font-size:2.3rem}
.tile.done .face.back{background:var(--good-soft)}

/* spájačka & triedička */
.match{position:relative;display:grid;grid-template-columns:1fr 1fr;gap:12px 40px}
.match svg.lines{position:absolute;inset:0;width:100%;height:100%;pointer-events:none;overflow:visible}
.mcol{display:flex;flex-direction:column;gap:12px}
.mi2{min-height:58px;padding:8px;border-radius:16px;border:2.5px solid var(--edge);background:var(--paper);box-shadow:0 4px 0 var(--drop);font-family:var(--f-display);font-weight:800;font-size:1.1rem;line-height:1.1;word-break:break-word;position:relative;z-index:1;transition:transform .15s,background .2s}
.mi2.e{font-size:2rem}
.mi2.sel{background:var(--sun);transform:scale(1.05)}
.mi2.done{color:#fff;pointer-events:none;animation:yay .5s}
.mi2.bad{animation:shake .45s;background:var(--bad-soft)}
.sortcard{padding:22px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:2rem;min-height:120px;display:grid;place-items:center}
.sortcard.enter{animation:qin .4s cubic-bezier(.2,.9,.3,1.25)}
.bins{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}
.bin{min-height:86px;border-radius:18px;border:2.5px solid var(--edge);box-shadow:0 5px 0 var(--drop);font-family:var(--f-display);font-weight:800;font-size:1.05rem;display:flex;flex-direction:column;align-items:center;justify-content:center;gap:2px;padding:6px;line-height:1.1}
.bin .bi{font-size:1.6rem}
.bin.right{animation:yay .5s;background:var(--good)!important;color:#fff} .bin.wrong{animation:shake .45s;background:var(--bad)!important;color:#fff}

/* minigames */
.gamearea{position:relative;height:min(62vh,520px);border-radius:var(--r);border:2.5px solid var(--edge);box-shadow:0 5px 0 var(--drop);overflow:hidden;background:linear-gradient(180deg,#BDE0FE,#E6F4FF 70%,#CDEFD9)}
.gamearea.rain{background:linear-gradient(180deg,#DCCBFF,#F4EEFF 70%,#FFE6F1)}
.target{font-family:var(--f-display);font-weight:800;font-size:1.25rem;text-align:center;padding:10px;border-radius:16px;background:var(--paper);border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--drop)}
.target b{color:var(--accent);font-size:1.7rem}
.balloon{position:absolute;bottom:-110px;width:86px;height:104px;border-radius:50% 50% 48% 48%;display:grid;place-items:center;font-family:var(--f-display);font-weight:800;font-size:1.15rem;color:#2A2650;border:2.5px solid rgba(42,38,80,.6);animation:rise linear forwards;padding:0 4px;line-height:1}
.balloon::after{content:"";position:absolute;bottom:-26px;left:50%;width:2px;height:26px;background:rgba(42,38,80,.5)}
@keyframes rise{to{transform:translateY(calc(-1 * min(62vh,520px) - 140px))}}
.popped{animation:popb .3s forwards!important} @keyframes popb{to{transform:scale(1.6);opacity:0}}
.drop{position:absolute;top:-60px;padding:8px 14px;border-radius:16px;background:var(--paper);border:2.5px solid var(--edge);box-shadow:0 4px 0 var(--drop);font-family:var(--f-display);font-weight:800;font-size:1.15rem;animation:fall linear forwards;white-space:nowrap;color:var(--ink)}
@keyframes fall{to{transform:translateY(calc(min(62vh,520px) + 80px))}}
.hearts{flex:none;font-size:1.2rem;letter-spacing:1px;white-space:nowrap}
.tfcard{padding:28px 18px;text-align:center;font-family:var(--f-display);font-weight:800;font-size:2rem;min-height:180px;display:grid;place-items:center;line-height:1.2}
.tfbtns{display:grid;grid-template-columns:1fr 1fr;gap:14px}
.tfbtns button{min-height:96px;font-size:2.6rem;border-radius:22px;border:2.5px solid var(--edge);box-shadow:0 6px 0 var(--drop)}
.tfbtns .yes{background:var(--good);color:#fff}.tfbtns .no{background:var(--bad);color:#fff}
.gamelist{display:flex;flex-direction:column;gap:14px}
.gcard{display:grid;grid-template-columns:76px 1fr;gap:14px;align-items:center;padding:14px;text-align:left;width:100%}
.gcard .gi{width:76px;height:76px;border-radius:20px;border:2.5px solid var(--edge);display:grid;place-items:center;font-size:2.6rem;animation:wig 3s infinite}
.gcard b{font-family:var(--f-display);font-size:1.3rem;display:block;line-height:1.1}
.gcard span{font-weight:700;color:var(--muted);font-size:.9rem;display:block}

/* result + overlays */
.result{align-items:center;text-align:center;padding:24px 18px;display:flex;flex-direction:column;gap:12px}
.bigstars{display:flex;gap:6px;font-size:3.4rem;line-height:1}
.bigstars span{animation:starin .6s backwards cubic-bezier(.3,1.8,.5,1);filter:drop-shadow(0 3px 0 var(--drop))}
.bigstars span.off{filter:grayscale(1) opacity(.35)}
@keyframes starin{from{transform:scale(0) rotate(-120deg)}}
.result h1{font-size:2.1rem}
.score{font-family:var(--f-display);font-weight:800;font-size:1.3rem}
.xpgain{font-family:var(--f-display);font-weight:800;font-size:1.6rem;color:var(--accent)}
.rowbtns{display:grid;grid-template-columns:1fr 1fr;gap:12px;width:100%}
.over{position:fixed;inset:0;z-index:60;display:flex;align-items:center;justify-content:center;padding:24px max(16px,env(safe-area-inset-right,0px)) 24px max(16px,env(safe-area-inset-left,0px));background:radial-gradient(circle at 50% 40%,rgba(255,201,77,.55),rgba(20,16,50,.75));animation:fade .3s}
.over .box{width:100%;max-width:420px;padding:22px 18px;text-align:center;display:flex;flex-direction:column;gap:12px;align-items:center;animation:boing .6s cubic-bezier(.3,1.6,.5,1);max-height:92vh;overflow:auto}
@keyframes boing{from{transform:scale(.4) rotate(-6deg);opacity:0}}
.over .num{font-family:var(--f-display);font-weight:800;font-size:4.5rem;line-height:1;color:var(--accent);text-shadow:0 4px 0 var(--drop)}
.gift{font-size:4.4rem;line-height:1;cursor:pointer;animation:giftw 1s infinite}
@keyframes giftw{0%,100%{transform:rotate(0)}25%{transform:rotate(-10deg) scale(1.06)}75%{transform:rotate(10deg) scale(1.06)}}
.gift.open{animation:giftopen .5s forwards} @keyframes giftopen{to{transform:scale(1.9);opacity:0}}
.rewards{display:flex;flex-wrap:wrap;gap:10px;justify-content:center}
.rew{width:96px;padding:6px;border-radius:16px;background:var(--paper2);border:2px solid var(--edge);display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.8rem;animation:popin .45s backwards cubic-bezier(.3,1.6,.5,1);line-height:1.1}
.rew .th{width:78px;height:78px;border-radius:12px;overflow:hidden;display:grid;place-items:center;font-size:2.4rem}
.rew .th svg{width:100%;height:100%}
.cal{display:grid;grid-template-columns:repeat(4,1fr);gap:8px;width:100%}
.cal .d{border-radius:16px;border:2.5px solid var(--edge);padding:8px 4px;display:flex;flex-direction:column;align-items:center;gap:2px;font-weight:800;font-size:.75rem;background:var(--paper)}
.cal .d .di{font-size:1.6rem;line-height:1}

/* wardrobe */

/* prechody obrazoviek – jemné odpruženie */
@keyframes inR{from{opacity:0;transform:translateX(34px) scale(.985)}to{opacity:1;transform:none}}
@keyframes inL{from{opacity:0;transform:translateX(-34px) scale(.985)}to{opacity:1;transform:none}}
@keyframes inF{from{opacity:0;transform:translateY(14px) scale(.985)}to{opacity:1;transform:none}}
.enter-r{animation:inR .34s cubic-bezier(.2,.9,.3,1.1)!important}.enter-l{animation:inL .34s cubic-bezier(.2,.9,.3,1.1)!important}.enter-f{animation:inF .32s cubic-bezier(.2,.9,.3,1.1)!important}
/* scéna na domove */
.stage{border:0!important;border-radius:32px!important;box-shadow:0 16px 34px -14px color-mix(in srgb,var(--ink) 35%,transparent)!important}
.stage .fig{animation:skinBob 3.2s ease-in-out infinite}
@keyframes skinBob{0%,100%{transform:translateY(0)}50%{transform:translateY(-6px)}}
.stage::after{content:"";position:absolute;inset:0;pointer-events:none;background:radial-gradient(circle at 18% 12%,rgba(255,255,255,.55) 0 2px,transparent 3px),radial-gradient(circle at 82% 30%,rgba(255,255,255,.5) 0 2px,transparent 3px),radial-gradient(circle at 60% 8%,rgba(255,255,255,.45) 0 1.5px,transparent 2.5px);animation:skinTw 2.6s ease-in-out infinite}
@keyframes skinTw{50%{opacity:.25}}
/* Lunapark (Hry) */
.lunahead{position:relative;overflow:hidden;border-radius:30px;padding:18px 18px 16px;color:#fff;background:linear-gradient(180deg,#2A1F5C 0%,#5B3FB8 62%,#FF9A6B 135%);box-shadow:0 16px 34px -14px rgba(42,31,92,.6)}
.lunahead h1{font-size:1.9rem;line-height:1;color:#fff;max-width:230px}
.lunahead p{margin:4px 0 0;font-weight:700;opacity:.88;font-size:.92rem;max-width:260px}
.lunahead .lights{position:absolute;left:-6px;right:-6px;top:8px;height:22px;display:flex;justify-content:space-between}
.lunahead .lights i{width:9px;height:9px;border-radius:50%;background:var(--c);box-shadow:0 0 10px var(--c);animation:luBlink 1.1s infinite;animation-delay:var(--d)}
@keyframes luBlink{50%{opacity:.25;transform:scale(.8)}}
.lunahead .wheel{position:absolute;right:-30px;bottom:-40px;width:140px;height:140px;border-radius:50%;border:3px solid rgba(255,224,122,.5);animation:luSpin 18s linear infinite}
.lunahead .wheel::before,.lunahead .wheel::after{content:"";position:absolute;left:50%;top:0;bottom:0;border-left:2px solid rgba(255,224,122,.4)}.lunahead .wheel::after{transform:rotate(90deg)}
@keyframes luSpin{to{transform:rotate(360deg)}}
.lunahead .lbear{position:absolute;right:6px;bottom:-6px;width:96px;height:96px;animation:skinBob 2.6s ease-in-out infinite}
.lunahead .lbear svg{width:100%;height:100%}
.lunahead .tix{display:inline-flex;align-items:center;gap:6px;margin-top:12px;background:#FFC233;color:#3A2400;border-radius:12px;padding:5px 11px;font-family:var(--f-display);font-weight:800;box-shadow:0 3px 0 #C98A00;transform:rotate(-2deg)}
.gcard .gi{border-radius:50%!important;box-shadow:inset -4px -6px 0 rgba(0,0,0,.12),inset 4px 4px 0 rgba(255,255,255,.35),0 4px 0 color-mix(in srgb,var(--ink) 12%,transparent)}
.gcard:not(.gbuy) .gi{animation:luFloat 3s ease-in-out infinite}
.gcard:nth-child(2n) .gi{animation-delay:.6s}.gcard:nth-child(3n) .gi{animation-delay:1.1s}
@keyframes luFloat{0%,100%{transform:translateY(0) rotate(-3deg)}50%{transform:translateY(-4px) rotate(3deg)}}
/* Ja – séria a polica úspechov */
.meweek{border-radius:24px;padding:12px 14px;color:#fff;background:linear-gradient(135deg,#FF9A5C,#FF6A88);box-shadow:0 5px 0 #D9541C,0 14px 26px -12px #FF6A88}
.meweek .r1{display:flex;justify-content:space-between;align-items:baseline}.meweek b{font-family:var(--f-display);font-size:1.15rem}.meweek small{font-weight:800;opacity:.9}
.meweek .days{display:flex;justify-content:space-between;margin-top:8px}
.meweek .days span{display:flex;flex-direction:column;align-items:center;gap:3px;font-size:.7rem;font-weight:900}
.meweek .days i{width:34px;height:34px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center;font-style:normal;font-size:1.05rem}
.meweek .days i.on{background:rgba(255,255,255,.95);animation:popUp .5s backwards cubic-bezier(.3,1.6,.5,1)}
.meweek .days i.today{box-shadow:0 0 0 3px #FFE07A}
.shelf{border-radius:24px;padding:10px 12px 8px;background:linear-gradient(180deg,#FFF1DE,#FFE3C2);box-shadow:inset 0 0 0 3px #F2D2A8;color:#3A2400}
:root.fdark .shelf,:root[data-theme="dark"] .shelf{background:linear-gradient(180deg,#4A3524,#3A2A1C);box-shadow:inset 0 0 0 3px #6B4A2E;color:#FBF1E4}
.shelf .r1{display:flex;justify-content:space-between;align-items:baseline}.shelf .r1 b{font-family:var(--f-display);font-size:1.1rem}.shelf .r1 small{font-weight:900;color:#B4651C}
.shelf .row{display:flex;justify-content:space-around;align-items:flex-end;min-height:62px;padding-top:4px}
.shelf .row button{font-size:2.1rem;line-height:1;background:none;border:0;padding:0 2px;cursor:pointer;animation:luFloat 4s ease-in-out infinite;filter:drop-shadow(0 3px 0 rgba(0,0,0,.12))}
.shelf .row button.off{filter:grayscale(1) opacity(.35);animation:none}
.shelf .row button:nth-child(2){animation-delay:.5s}.shelf .row button:nth-child(3){animation-delay:1s}.shelf .row button:nth-child(4){animation-delay:1.5s}.shelf .row button:nth-child(5){animation-delay:2s}
.shelf .board{height:10px;border-radius:6px;background:linear-gradient(#C98A4E,#9B6A3A);box-shadow:0 4px 0 rgba(0,0,0,.12)}
.shelf .tip{font-size:.78rem;font-weight:800;text-align:center;margin-top:6px;opacity:.8;min-height:1.1em}
/* Plus – výhody */
.plusperks{display:grid;grid-template-columns:1fr 1fr;gap:8px;margin:8px 0}
.plusperks div{display:flex;gap:8px;align-items:center;background:var(--paper2);border-radius:14px;padding:8px 9px;animation:popUp .45s backwards cubic-bezier(.3,1.6,.5,1)}
.plusperks span{flex:none;width:32px;height:32px;border-radius:10px;background:var(--paper);display:grid;place-items:center;font-size:1.1rem}
.plusperks b{display:block;font-size:.82rem;line-height:1.15}.plusperks small{display:block;font-size:.7rem;font-weight:700;color:var(--muted);line-height:1.2}
.plusperks em{font-style:normal;font-size:.62rem;font-weight:900;color:var(--lilac);text-transform:uppercase;letter-spacing:.04em}
/* tlačidlá „hlbšie“ pri ťuknutí – trblietka */
.btn.primary{position:relative;overflow:hidden}
.btn.primary::after{content:"";position:absolute;top:-30%;left:-60%;width:40%;height:160%;background:linear-gradient(90deg,transparent,rgba(255,255,255,.35),transparent);transform:rotate(20deg);animation:skinShine 4.5s ease-in-out infinite;pointer-events:none}
@keyframes skinShine{0%,70%{left:-60%}100%{left:130%}}
html.lite .btn.primary::after,html.lite .stage::after,html.lite .lunahead .lights i,html.lite .lunahead .wheel,html.lite .gcard .gi,html.lite .shelf .row button,html.lite .stage .fig{animation:none!important}
@media (prefers-reduced-motion: reduce){.view>*,.btn.primary::after,.stage .fig,.gcard .gi,.shelf .row button{animation:none!important}}

/* Medový úľ */
.hivetog{display:flex;align-self:flex-start;background:var(--paper2);border-radius:999px;padding:3px;gap:2px}
.hivetog button{border:0;background:none;font:800 .9rem var(--f-display);color:var(--muted);padding:6px 14px;border-radius:999px;cursor:pointer;transition:background .2s,color .2s}
.hivetog button.on{background:var(--paper);color:var(--ink);box-shadow:0 2px 6px color-mix(in srgb,var(--ink) 15%,transparent)}
.hive{position:relative;padding:14px 0 10px;border-radius:28px;background:radial-gradient(circle at 50% 0,color-mix(in srgb,var(--sun) 22%,transparent),transparent 70%)}
.hrow{display:flex;justify-content:center;gap:5px}
.hrow+.hrow{margin-top:-20px}
.hcell{--w:80px;width:var(--w);height:calc(var(--w)*1.155);flex:none;border:0;padding:0;cursor:pointer;background:#E9B54A;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);position:relative;animation:hivePop .5s backwards cubic-bezier(.3,1.6,.5,1);filter:drop-shadow(0 3px 0 rgba(150,90,0,.25))}
.hcell .hin{position:absolute;inset:4px;clip-path:polygon(50% 0,100% 25%,100% 75%,50% 100%,0 75%,0 25%);background:linear-gradient(180deg,#FFF6DC,#FCE7B0);display:flex;flex-direction:column;align-items:center;justify-content:center;gap:1px;padding:10px 6px 8px;overflow:hidden}
:root.fdark .hcell .hin,:root[data-theme="dark"] .hcell .hin{background:linear-gradient(180deg,#3E3366,#33295C)}
.hcell .honey{position:absolute;left:-10%;right:-10%;bottom:0;height:var(--h);background:linear-gradient(180deg,#FFD24D,#F29E00);transition:height .8s cubic-bezier(.3,1.4,.5,1)}
.hcell .honey::before{content:"";position:absolute;left:0;right:0;top:-6px;height:12px;background:radial-gradient(circle at 10px 12px,#FFD24D 9px,transparent 10px) 0 0/20px 12px repeat-x;animation:hiveWave 2.4s linear infinite}
@keyframes hiveWave{to{background-position:20px 0}}
.hcell .hi,.hcell .hn,.hcell .hs{position:relative}
.hcell .hi{font-size:1.45rem;line-height:1}
.hcell .hi img{width:28px;height:28px}
.hcell .hn{font:800 .62rem/1.1 var(--f-body);color:#5A3A00;text-align:center;display:-webkit-box;-webkit-line-clamp:2;-webkit-box-orient:vertical;overflow:hidden;max-width:64px}
:root.fdark .hcell .hn,:root[data-theme="dark"] .hcell .hn{color:#F3EEFF}
.hcell .hs{font-size:.6rem;color:#C98200;letter-spacing:1px}
.hcell.full{background:#F29E00}
.hcell.full .hn{color:#5A3A00}.hcell.full .hs{color:#fff}
.hcell.full::after{content:"";position:absolute;inset:0;background:linear-gradient(115deg,transparent 30%,rgba(255,255,255,.55) 45%,transparent 60%);background-size:250% 100%;animation:hiveShine 3s ease-in-out infinite}
@keyframes hiveShine{0%,60%{background-position:150% 0}100%{background-position:-60% 0}}
.hcell.na{opacity:.45}
.hcell.day{background:#FF7A3D}
.hcell .hday{position:absolute;top:10px;right:14px;font:800 .6rem var(--f-display);background:#FF7A3D;color:#fff;border-radius:999px;padding:0 4px}
@keyframes hivePop{0%{opacity:0;transform:scale(.3) rotate(-20deg)}100%{opacity:1;transform:none}}
.hive .bee{position:absolute;font-size:1.2rem;z-index:2;pointer-events:none}
.hive .b1{top:-4px;left:6%;animation:beeA 9s ease-in-out infinite}
.hive .b2{bottom:0;right:4%;animation:beeB 11s ease-in-out infinite}
@keyframes beeA{0%,100%{transform:translate(0,0) scaleX(1)}25%{transform:translate(120px,30px) scaleX(1)}50%{transform:translate(260px,-6px) scaleX(-1)}75%{transform:translate(120px,50px) scaleX(-1)}}
@keyframes beeB{0%,100%{transform:translate(0,0) scaleX(-1)}30%{transform:translate(-160px,-40px) scaleX(-1)}60%{transform:translate(-260px,-10px) scaleX(1)}80%{transform:translate(-100px,-70px) scaleX(1)}}
.hivebear{display:flex;align-items:center;gap:12px;padding:10px 14px;background:linear-gradient(120deg,#FFF2C7,var(--paper) 70%)}
:root.fdark .hivebear,:root[data-theme="dark"] .hivebear{background:linear-gradient(120deg,#4A3A1E,var(--paper) 70%)}
.hivebear .hbb{flex:none;width:72px;height:72px;animation:skinBob 2.8s ease-in-out infinite}.hivebear .hbb svg{width:100%;height:100%}
.hivebear .grow{flex:1;min-width:0;display:flex;flex-direction:column;gap:4px}.hivebear b{font-family:var(--f-display);font-size:1.1rem}.hivebear small{font-weight:700;color:var(--muted);font-size:.82rem;line-height:1.3}
.hivebear .pbar{height:10px;border-radius:999px;background:color-mix(in srgb,var(--sun) 25%,transparent);overflow:hidden}.hivebear .pbar i{display:block;height:100%;border-radius:999px;background:linear-gradient(90deg,#FFD24D,#F29E00)}
html.lite .hcell .honey::before,html.lite .hcell.full::after,html.lite .hive .bee,html.lite .hivebear .hbb{animation:none!important}
@media (min-width:600px){.hcell{--w:96px}.hcell .hn{font-size:.72rem;max-width:78px}}

/* ===== Domov 2.0 ===== */
.home2{gap:14px}
.hero2{position:relative;height:250px;border-radius:32px;overflow:hidden;background:linear-gradient(180deg,#FFD3A8 0%,#FFE6C8 55%,#FFF2E0 100%);box-shadow:0 16px 34px -16px rgba(150,80,20,.45);animation:skinUp .5s backwards cubic-bezier(.2,.9,.3,1.15)}
.hero2.night{background:linear-gradient(180deg,#14103A 0%,#2B2366 60%,#3B2F7A 100%);box-shadow:0 16px 34px -16px rgba(0,0,0,.6)}
.hero2 i{position:absolute;pointer-events:none}
.h2sun{right:-18px;top:-18px;width:104px;height:104px;border-radius:50%;background:radial-gradient(circle,#FFE07A 0 34%,#FFC233 35% 46%,rgba(255,194,51,.35) 47% 60%,transparent 61%);animation:luSpin 30s linear infinite}
.hero2.night .h2sun{background:radial-gradient(circle at 40% 40%,#FFF6C8 0 30%,transparent 31%),radial-gradient(circle,rgba(255,246,200,.25) 0 45%,transparent 46%);right:10px;top:8px;width:84px;height:84px;animation:none}
.h2cloud{width:92px;height:28px;border-radius:30px;background:#fff;opacity:.9;box-shadow:24px -12px 0 -2px #fff,52px -4px 0 -6px #fff;animation:h2drift 14s ease-in-out infinite alternate}
.h2cloud.c1{left:30px;top:30px}.h2cloud.c2{left:190px;top:70px;transform:scale(.7);animation-duration:19s;animation-direction:alternate-reverse;opacity:.75}
.hero2.night .h2cloud{opacity:.12}
@keyframes h2drift{from{translate:-30px 0}to{translate:40px 0}}
.h2stars{inset:0;opacity:0;background-image:radial-gradient(circle,#fff 1px,transparent 1.6px),radial-gradient(circle,#fff 1.2px,transparent 2px);background-size:70px 60px,110px 90px;background-position:10px 6px,40px 30px;animation:skinTw 3s ease-in-out infinite}
.hero2.night .h2stars{opacity:.8}
.h2hill{left:-10%;right:-10%;border-radius:50% 50% 0 0}
.h2hill.h1{bottom:-70px;height:150px;background:#9ED69A}.h2hill.h2{bottom:-100px;height:150px;left:30%;right:-30%;background:#7CC478}
.hero2.night .h2hill.h1{background:#2D4E5A}.hero2.night .h2hill.h2{background:#24414D}
.h2kid{position:absolute;left:18px;bottom:6px;width:130px;height:200px;padding:0;border:0;background:none;cursor:pointer;animation:skinBob 3.2s ease-in-out infinite}
.h2kid .avatar,.h2kid svg{width:100%;height:100%}
.h2bear{position:absolute;left:128px;bottom:4px;width:116px;height:116px;padding:0;border:0;background:none;cursor:pointer;animation:skinBob 2.7s ease-in-out .5s infinite}
.h2bear svg{width:100%;height:100%}
.h2bear.jump{animation:h2jump .7s cubic-bezier(.3,1.6,.5,1)}
@keyframes h2jump{30%{transform:translateY(0) scale(1.1,.88)}55%{transform:translateY(-34px) scale(.95,1.06)}80%{transform:translateY(0) scale(1.06,.94)}}
.h2bub{position:absolute;right:12px;top:16px;max-width:150px;background:#fff;color:#23163A;border-radius:20px 20px 20px 6px;padding:10px 12px;box-shadow:0 8px 18px -8px rgba(35,22,58,.35);animation:popUp .5s .35s backwards cubic-bezier(.3,1.6,.5,1)}
.h2bub b{font:800 .92rem/1.25 var(--f-display)}
.bag2{padding:14px 14px 10px;display:flex;flex-direction:column;gap:8px}
.b2head{display:flex;align-items:center;gap:8px}.b2head h2{flex:1;font-size:1.25rem}.b2ic{font-size:1.4rem}
.b2n{font:800 .9rem var(--f-display);color:var(--muted)}
.b2row{display:flex;align-items:center;gap:12px;width:100%;text-align:left;background:var(--paper2);border:2px solid transparent;border-radius:18px;padding:9px 10px;font-family:inherit;color:var(--ink);cursor:pointer;animation:skinUp .45s backwards cubic-bezier(.2,.9,.3,1.15)}
.b2row .b2i{flex:none;width:44px;height:44px;border-radius:15px 12px 16px 11px;display:grid;place-items:center;font-size:1.35rem;background:color-mix(in srgb,var(--c) 16%,var(--paper))}
.b2row .grow{flex:1;min-width:0;display:flex;flex-direction:column}.b2row b{font:800 1.02rem/1.15 var(--f-display)}.b2row small{font-weight:700;font-size:.8rem;color:var(--muted);line-height:1.25}
.b2row.now{border-color:var(--accent);background:color-mix(in srgb,var(--accent) 9%,var(--paper))}
.b2row.done{opacity:.72}.b2row.done b{text-decoration:line-through;text-decoration-thickness:2px;text-decoration-color:color-mix(in srgb,var(--ink) 35%,transparent)}
.b2ok{flex:none;width:30px;height:30px;border-radius:50%;background:var(--good);color:#fff;display:grid;place-items:center;font-weight:900}
.b2now{flex:none;font:800 .72rem var(--f-display);color:#fff;background:var(--accent);border-radius:999px;padding:3px 9px;animation:pulse 1.6s infinite}
.b2dot{flex:none;width:26px;height:26px;border-radius:50%;border:2.5px solid var(--line)}
.b2foot{font-size:.8rem;font-weight:800;color:var(--muted);padding:2px 4px}
.bigplay{min-height:64px;font-size:1.3rem;gap:10px}.bigplay .bpi{font-size:1rem;width:30px;height:30px;border-radius:50%;background:rgba(255,255,255,.25);display:grid;place-items:center}
.hchips{display:flex;gap:8px;overflow-x:auto;scrollbar-width:none;padding:2px}
.hchip{flex:none;display:flex;align-items:center;gap:6px;border:0;background:var(--paper);border-radius:999px;padding:9px 14px;font:800 .92rem var(--f-display);color:var(--ink);box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 6%,transparent),0 8px 16px -10px color-mix(in srgb,var(--ink) 35%,transparent);cursor:pointer}
.hchip.hot{background:var(--sun);color:#3A2400;animation:pulse 1.6s infinite}
.hmore{padding:0;overflow:hidden}
.hmore summary{list-style:none;display:flex;align-items:center;gap:10px;padding:14px 16px;cursor:pointer}.hmore summary::-webkit-details-marker{display:none}
.hmore summary b{flex:1;font:800 1.08rem var(--f-display)}.hmore summary small{font-weight:900;color:var(--muted)}
.hmore summary::after{content:"›";font-size:1.5rem;font-weight:900;color:var(--muted);transition:transform .25s}.hmore[open] summary::after{transform:rotate(90deg)}
.hmorein{display:flex;flex-direction:column;gap:12px;padding:0 12px 12px}.hmorein>.card{box-shadow:none;border:1.5px solid var(--line)}
/* Učenie – prepínač a pomocníci */
.lhead{display:flex;align-items:flex-end;justify-content:space-between}.lgrade{font:800 .85rem var(--f-display);background:var(--paper);border-radius:999px;padding:5px 12px;color:var(--muted);box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 6%,transparent)}
.segtabs{display:flex;background:color-mix(in srgb,var(--ink) 7%,transparent);border-radius:999px;padding:4px;gap:4px}
.segtabs button{flex:1;border:0;background:none;height:42px;border-radius:999px;font:800 1rem var(--f-display);color:var(--muted);cursor:pointer;transition:background .25s,color .25s,box-shadow .25s}
.segtabs button.on{background:var(--paper);color:var(--ink);box-shadow:0 3px 10px -2px color-mix(in srgb,var(--ink) 25%,transparent)}
.helpers2{display:grid;grid-template-columns:1fr 1fr;gap:10px}
.helpers2 button{position:relative;overflow:hidden;min-height:118px;border:0;border-radius:26px;padding:12px 14px;text-align:left;display:flex;flex-direction:column;justify-content:flex-end;gap:2px;font-family:inherit;cursor:pointer}
.helpers2 b{position:relative;font:800 1.15rem/1 var(--f-display)}.helpers2 small{position:relative;font-weight:800;font-size:.76rem;line-height:1.25;max-width:100px}
.h2ai{background:linear-gradient(150deg,#8B7CFF,#6152E8);color:#fff;box-shadow:0 5px 0 #4C3FC4,0 14px 24px -12px rgba(97,82,232,.6)}
.h2ai .hnew{position:absolute;left:12px;top:12px;font:900 .64rem var(--f-body);letter-spacing:.05em;background:rgba(255,255,255,.22);border-radius:999px;padding:3px 8px}
.h2ai .hbear{position:absolute;right:-16px;bottom:-22px;width:86px;height:86px;animation:skinBob 2.6s ease-in-out infinite}.h2ai .hbear svg{width:100%;height:100%}
.h2notes{background:var(--paper);color:var(--ink);box-shadow:0 2px 0 color-mix(in srgb,var(--ink) 5%,transparent),0 14px 26px -14px color-mix(in srgb,var(--ink) 30%,transparent)}
.h2notes small{color:var(--muted)}
.h2notes .hpaper{position:absolute;right:14px;top:12px;width:46px;height:54px;border-radius:8px;background:#fff;transform:rotate(-7deg);box-shadow:0 3px 8px rgba(35,22,58,.18),8px 4px 0 -2px #FFF2C7;display:flex;flex-direction:column;gap:6px;padding:10px 7px;box-sizing:border-box}
.h2notes .hpaper i{display:block;height:3px;border-radius:2px;background:#C9D7F5}.h2notes .hpaper i:nth-child(2){width:70%;background:#F5C3D2}
.h2notes .hcam{position:absolute;right:6px;top:52px;width:28px;height:28px;border-radius:50%;background:var(--accent);display:grid;place-items:center;font-size:.9rem;box-shadow:0 2px 0 var(--accent-d)}
html.lite .hero2 *,html.lite .hero2,html.lite .h2ai .hbear{animation:none!important}

/* ===== 2.0: hlavička, menu s 3 záložkami, Ja ===== */
.top2{gap:10px;padding-top:12px;padding-bottom:6px}
.top2 .headbub{width:46px;height:46px;border-radius:50%;background:#FFE3CF;overflow:hidden}

/* ===== Bystríkov diktafón ===== */
.dk{display:flex;flex-direction:column;align-items:center;gap:10px;padding:16px 12px 14px;border-radius:24px;background:linear-gradient(170deg,#2A2160,#4B3DB8);color:#fff;position:relative;overflow:hidden}

.dkrec{position:relative;width:86px;height:86px;border-radius:50%;border:0;cursor:pointer;background:#fff;display:grid;place-items:center;box-shadow:0 6px 0 rgba(0,0,0,.25),0 0 0 8px rgba(255,255,255,.12)}
